name: Temporary P0 Layaway Authorization PostgreSQL Test

on:
  push:
    branches: [codex/p0-cloud-layaway-refunds]
    paths:
      - 'supabase/migrations/20261113185604_p0_layaway_cancel_requires_refunds.sql'
      - 'supabase/tests/layaway_cancel_refunds_authorization_p0_test.sql'
      - 'scripts/supabase/p0-layaway-auth-*-temporary.sql'
      - 'scripts/supabase/p0-layaway-auth-production-baseline-temporary.b64'
      - '.github/workflows/p0-layaway-auth-temporary.yml'

permissions:
  contents: read

jobs:
  p0-layaway-auth-postgres-17:
    name: P0 SQL integration (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create disposable database and Supabase roles
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE DATABASE p0_layaway_auth;
          SQL
          server_version="$(psql -X -d p0_layaway_auth -Atqc 'SHOW server_version')"
          echo "PostgreSQL ${server_version} (disposable service)"
          [[ "${server_version}" == 17.* ]]
          echo "PostgreSQL server: ${server_version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Load synthetic schema and Production-derived routine baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          sources = json.loads(Path('supabase/tests/fixtures/pr338-real-financial/02-function-sources.json').read_text(encoding='utf-8'))
          generated = Path(os.environ['RUNNER_TEMP']) / 'p0-layaway-auth-fixture-functions.sql'
          generated.write_text('\\set ON_ERROR_STOP on\nSET check_function_bodies = off;\n' + '\n'.join(source.rstrip() + ';' for source in sources) + '\n', encoding='utf-8')
          baseline = Path(os.environ['RUNNER_TEMP']) / 'p0-layaway-auth-production-baseline.sql'
          baseline.write_bytes(base64.b64decode(Path('scripts/supabase/p0-layaway-auth-production-baseline-temporary.b64').read_bytes()))
          PY
          db_args=(-X -v ON_ERROR_STOP=1 -d p0_layaway_auth)
          for file in \
            supabase/tests/fixtures/pr338-real-financial/01-schema.sql \
            "${RUNNER_TEMP}/p0-layaway-auth-fixture-functions.sql" \
            supabase/tests/fixtures/pr338-real-financial/03-trigger-dependencies.sql \
            supabase/tests/fixtures/pr338-real-financial/04-constraints-indexes-triggers.sql \
            supabase/tests/fixtures/pr338-real-financial/05-policies.sql \
            supabase/tests/fixtures/pr338-real-financial/06-function-acl.sql \
            scripts/supabase/p0-layaway-auth-fixture-temporary.sql \
            "${RUNNER_TEMP}/p0-layaway-auth-production-baseline.sql" \
            scripts/supabase/p0-layaway-auth-triggers-temporary.sql; do
            psql "${db_args[@]}" -f "${file}"
          done

      - name: Verify exact pre-migration Production function hashes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(psql -X -d p0_layaway_auth -Atqc "SELECT string_agg(n.nspname || '.' || p.proname || '=' || md5(pg_get_functiondef(p.oid)), '|' ORDER BY n.nspname,p.proname) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE (n.nspname,p.proname) IN (('private','pos_execute_financial_operation_core_v2'),('public','pos_execute_financial_operation_v1'),('public','pos_get_financial_operation_receipt'),('public','pos_get_financial_operation_receipt_v2'))")"
          expected='private.pos_execute_financial_operation_core_v2=bcaca2181fe248a1f6407380f33bc060|public.pos_execute_financial_operation_v1=503c7cbc2bbc71772649dbf6ff562a57|public.pos_get_financial_operation_receipt=0eb091ed1701ee15559eccc5ba6c3a7f|public.pos_get_financial_operation_receipt_v2=4a1334e1e7b68b35463c160198ae5232'
          printf 'Pre-migration function hashes: %s\n' "${actual}"
          [[ "${actual}" == "${expected}" ]]

      - name: Apply the requested migration on PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -d p0_layaway_auth -f supabase/migrations/20261113185604_p0_layaway_cancel_requires_refunds.sql

      - name: Run P0-01 through P0-09 authorization integration test
        run: psql -X -v ON_ERROR_STOP=1 -d p0_layaway_auth -f supabase/tests/layaway_cancel_refunds_authorization_p0_test.sql

      - name: Verify function signatures, owners, ACLs, options, and guards
        run: psql -X -v ON_ERROR_STOP=1 -d p0_layaway_auth -f scripts/supabase/p0-layaway-auth-metadata-temporary.sql

      - name: Record SQL integration acceptance
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          SQL_INTEGRATION_PASS

          Executed the canonical migration and layaway_cancel_refunds_authorization_p0_test.sql on isolated PostgreSQL 17.
          Verified function signatures, owner, SECURITY DEFINER options, search_path/timeouts, exact ACLs, and authorization guard ordering.
          The SQL contract asserts revoked permissions, receipt denial/recovery, idempotent retries, tenant isolation, and no unauthorized financial side effects.
          SUMMARY
