name: Temporary P0 Layaway Authorization PostgreSQL Test

on:
  push:
    branches: [codex/p0-cloud-layaway-refunds]
    paths:
      - 'supabase/migrations/20261113185604_p0_layaway_cancel_requires_refunds.sql'
      - 'supabase/tests/layaway_cancel_refunds_authorization_p0_test.sql'
      - '.github/workflows/p0-layaway-auth-temporary.yml'

permissions:
  contents: read

jobs:
  p0-layaway-auth-postgres-17:
    name: P0 SQL integration (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0

      - name: Start isolated Supabase stack and apply repository migrations
        run: supabase start

      - name: Record PostgreSQL server version
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "${db_container}"
          server_version="$(docker exec "${db_container}" psql -U postgres -d postgres -Atqc 'show server_version')"
          echo "PostgreSQL ${server_version} (${db_container})"
          [[ "${server_version}" == 17* ]]
          echo "PostgreSQL version: ${server_version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply P0 migration and execute authorization contract test
        run: supabase test db --local supabase/tests/layaway_cancel_refunds_authorization_p0_test.sql

      - name: Record acceptance marker
        run: echo 'SQL_INTEGRATION_PASS' >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop temporary local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
