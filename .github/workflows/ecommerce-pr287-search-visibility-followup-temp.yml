name: Ecommerce PR287 Visible Search Follow-up Temporary

on:
  push:
    branches:
      - fix/ecommerce-product-publish-modal-state-r1

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/ecommerce-product-publish-modal-state-r1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply visible-search UI and regression tests
        run: python .github/scripts/ecommerce_pr287_search_visibility_followup_temp.py ui-tests

      - name: Align existing active-search load-more copy assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx')
          text = path.read_text(encoding='utf-8')
          old = "expect(screen.getByRole('button', { name: 'Cargar más productos' }).disabled).toBe(false);"
          new = "expect(screen.getByRole('button', { name: 'Cargar más resultados' }).disabled).toBe(false);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale-load-more copy assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prove legacy createdAt search behavior before DB change
        id: legacy_preflight
        shell: bash
        run: |
          set +e
          npm run test:ci -- src/services/db/__tests__/loadDataPaginatedLegacySearch.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Fix DB search only when legacy test proves the defect
        if: steps.legacy_preflight.outputs.passed != 'true'
        run: python .github/scripts/ecommerce_pr287_search_visibility_followup_temp.py db-fix

      - name: Reapply scoped DB fix without newline churn
        if: steps.legacy_preflight.outputs.passed != 'true'
        shell: bash
        run: |
          git checkout HEAD -- src/services/db/index.js
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/db/index.js')
          raw = path.read_bytes()
          newline = b'\r\n' if b'\r\n' in raw else b'\n'
          old_text = """            } else:
                // Con searchTerm y sin cursor: full scan para no excluir registros
                // con createdAt undefined que orderBy sí omite
                baseCollection = db.table(STORES.MENU).orderBy(timeIndex).reverse();
            }
"""
          new_text = """            } else:
                // Con searchTerm y sin cursor: full scan para no excluir registros
                // con createdAt undefined que orderBy sí omite.
                // Esta rama es deliberadamente acotada: no cambia paginación normal,
                // filtros por categoría, stock/caducidad ni búsquedas con cursor.
                baseCollection = db.table(STORES.MENU).toCollection();
            }
"""
          old = old_text.encode('utf-8').replace(b'\n', newline)
          new = new_text.encode('utf-8').replace(b'\n', newline)
          if raw.count(old) != 1:
              raise SystemExit(f'expected one scoped DB branch, found {raw.count(old)}')
          path.write_bytes(raw.replace(old, new, 1))
          PY

      - name: Verify legacy createdAt search contract
        run: npm run test:ci -- src/services/db/__tests__/loadDataPaginatedLegacySearch.test.js

      - name: Run focused ecommerce and local-search regression suite
        run: >-
          npm run test:ci --
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.catalogLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.stockMode.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.configurationSync.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          src/utils/__tests__/ecommerceWholesalePricing.test.js
          src/utils/__tests__/businessCapabilities.test.js
          src/services/db/__tests__/loadDataPaginatedLegacySearch.test.js
          src/services/products/__tests__/productRepository.freeLocalAuthority.test.js

      - name: Focal ESLint zero-warning gate
        run: >-
          npx eslint --max-warnings=0
          src/components/ecommerce/EcommercePortalSettings.jsx
          src/components/ecommerce/EcommerceProductPublishModal.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.catalogLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx
          src/services/db/index.js
          src/services/db/__tests__/loadDataPaginatedLegacySearch.test.js

      - name: Diff check
        run: git diff --check origin/main...HEAD && git diff --check

      - name: Production build
        run: npm run build

      - name: Commit validated correction and remove temporary helpers
        shell: bash
        run: |
          git rm .github/workflows/ecommerce-pr287-search-visibility-followup-temp.yml
          git rm .github/scripts/ecommerce_pr287_search_visibility_followup_temp.py
          git config user.name "fdxruli"
          git config user.email "48109415+fdxruli@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ecommerce): show selectable product search results"
          git push origin HEAD:fix/ecommerce-product-publish-modal-state-r1
