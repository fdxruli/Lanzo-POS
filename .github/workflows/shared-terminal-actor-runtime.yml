name: Shared Terminal Actor Runtime Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/auth/**'
      - 'src/services/tenant/**'
      - 'src/services/db/**'
      - 'src/services/supabase.js'
      - 'src/store/slices/license/**'
      - 'scripts/compare-shared-terminal-full-suite.mjs'
      - 'scripts/ci/focused-target-evidence.mjs'
      - 'scripts/ci/focused-target-evidence.node-test.mjs'
      - 'scripts/ci/compare-focused-target-evidence.mjs'
      - 'scripts/ci/shared-terminal-public-store-targets.json'
      - 'scripts/generate-shared-terminal-actor-runtime-report.mjs'
      - 'docs/reports/SHARED.TERMINAL.1.ACTOR.RUNTIME.FOUNDATION.md'
      - 'docs/reports/SHARED.TERMINAL.2.DEVICE.ACTOR.AUTH.CUTOVER.md'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
      - '.github/workflows/shared-terminal-actor-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Immutable SHARED.TERMINAL.1 ActorRuntime contract baseline.
  SHARED_TERMINAL_CONTRACT_BASE_SHA: 2f3457313b81f09937acab6fe4bac4399e79035f
  # Current PR refs drive new-regression attribution. Manual runs have no PR base.
  SHARED_TERMINAL_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  SHARED_TERMINAL_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  focused-validation:
    name: Focused ActorRuntime / tenant / auth / lint / builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate comparison refs
        shell: bash
        run: |
          echo "EVENT_MODE=${GITHUB_EVENT_NAME}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_CANDIDATE_SHA}"
          echo "CONTRACT_BASE_SHA=${SHARED_TERMINAL_CONTRACT_BASE_SHA}"
          test -n "${SHARED_TERMINAL_CANDIDATE_SHA}"
          test -n "${SHARED_TERMINAL_CONTRACT_BASE_SHA}"
          git cat-file -e "${SHARED_TERMINAL_CANDIDATE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_CONTRACT_BASE_SHA}^{commit}"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "PR_BASE_SHA=${SHARED_TERMINAL_PR_BASE_SHA}"
            test -n "${SHARED_TERMINAL_PR_BASE_SHA}"
            git cat-file -e "${SHARED_TERMINAL_PR_BASE_SHA}^{commit}"
            echo "WHITESPACE_GATE_MODE=BLOCKING_COMPARISON"
            echo "BASE_CANDIDATE_DIFFERENTIAL_MODE=BLOCKING_COMPARISON"
          else
            echo "MANUAL_BASE_SHA=N/A"
            echo "MANUAL_CANDIDATE_SHA=${SHARED_TERMINAL_CANDIDATE_SHA}"
            echo "WHITESPACE_GATE_MODE=NOT_APPLICABLE"
            echo "BASE_CANDIDATE_DIFFERENTIAL_MODE=NOT_APPLICABLE"
          fi

      - name: PR-local blocking whitespace hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${SHARED_TERMINAL_PR_BASE_SHA}...${SHARED_TERMINAL_CANDIDATE_SHA}"

      - name: Manual whitespace hygiene classification
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "EVENT_MODE=workflow_dispatch"
          echo "MANUAL_BASE_SHA=N/A"
          echo "MANUAL_CANDIDATE_SHA=${SHARED_TERMINAL_CANDIDATE_SHA}"
          echo "WHITESPACE_GATE_MODE=NOT_APPLICABLE"
          echo "PR-local blocking whitespace hygiene is not applicable without pull_request attribution."

      - name: Historical contract-base whitespace observation
        if: always()
        shell: bash
        run: |
          set +e
          git diff --check "${SHARED_TERMINAL_CONTRACT_BASE_SHA}...${SHARED_TERMINAL_CANDIDATE_SHA}"
          historical_status=$?
          set -e

          if [[ "${historical_status}" -eq 0 ]]; then
            echo "Historical contract-base whitespace check: no findings."
          else
            echo "::warning title=Historical contract-base whitespace::Existing findings are observational only and do not block validation."
          fi

          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused evidence runner tests
        run: node --test scripts/ci/focused-target-evidence.node-test.mjs

      - name: ActorRuntime focused tests
        run: npx vitest run src/services/auth/__tests__/actorRuntimeController.test.js src/services/auth/__tests__/actorSessionRuntimeBridge.test.js --maxWorkers=4

      - name: Tenant isolation and recovery regression
        run: npx vitest run src/services/tenant/__tests__ src/services/db/__tests__ --maxWorkers=4

      - name: Authentication regression
        run: npx vitest run src/store/slices/license --maxWorkers=4

      - name: Relevant ESLint
        if: always()
        run: >-
          npx eslint
          src/services/auth/actorRuntimeController.js
          src/services/auth/actorSessionRuntimeBridge.js
          src/services/auth/__tests__/actorRuntimeController.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/store/slices/license/licenseAdminActions.js
          src/store/slices/license/licenseStaffActions.js
          src/store/slices/license/licenseBootstrapActions.js
          src/store/slices/license/licenseProcessingActions.js
          src/store/slices/license/licenseAdminActions.test.js
          src/store/slices/license/licenseSessionTransitions.test.js
          src/store/slices/license/__tests__/licenseAdminActions.localRecovery.test.js
          src/store/slices/license/__tests__/licenseBootstrapCoordinator.test.js
          scripts/compare-shared-terminal-full-suite.mjs
          scripts/generate-shared-terminal-actor-runtime-report.mjs
          scripts/ci/focused-target-evidence.mjs
          scripts/ci/focused-target-evidence.node-test.mjs
          scripts/ci/compare-focused-target-evidence.mjs

      - name: npm run build
        if: always()
        run: npm run build

      - name: npm run build:store
        if: always()
        run: npm run build:store

  full-suite-baseline:
    name: Full suite BASE repeated (observational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate evidence tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_CANDIDATE_SHA }}
          path: evidence-tools

      - name: Checkout exact BASE SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_PR_BASE_SHA }}
          path: subject

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Install dependencies
        working-directory: subject
        run: npm ci

      - name: Build BASE validation artifacts
        working-directory: subject
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: BASE PublicStore focused repetitions (fail-closed evidence)
        run: >-
          node evidence-tools/scripts/ci/focused-target-evidence.mjs
          --targets evidence-tools/scripts/ci/shared-terminal-public-store-targets.json
          --subject-dir subject
          --output-dir .
          --repetitions 50
          --max-workers 4

      - name: BASE raw full-suite repetitions
        shell: bash
        working-directory: subject
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="../full-suite-${i}.json" 2>&1 | tee "../full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "../full-suite-${i}.exit"
            echo "BASE repetition ${i} raw exit code: ${code}"
          done

      - name: Record BASE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "BASE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('BASE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload BASE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-base-full-suite
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
            public-store-*.json
            public-store-*.log
            public-store-*.exit
            focused-target-summary.json
          if-no-files-found: error

  full-suite-candidate:
    name: Full suite CANDIDATE repeated (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate evidence tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_CANDIDATE_SHA }}
          path: evidence-tools

      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_CANDIDATE_SHA }}
          path: subject

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Install dependencies
        working-directory: subject
        run: npm ci

      - name: Build CANDIDATE validation artifacts
        working-directory: subject
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: CANDIDATE PublicStore focused repetitions (fail-closed evidence)
        run: >-
          node evidence-tools/scripts/ci/focused-target-evidence.mjs
          --targets evidence-tools/scripts/ci/shared-terminal-public-store-targets.json
          --subject-dir subject
          --output-dir .
          --repetitions 50
          --max-workers 4

      - name: CANDIDATE raw full-suite repetitions
        shell: bash
        working-directory: subject
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="../full-suite-${i}.json" 2>&1 | tee "../full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "../full-suite-${i}.exit"
            echo "CANDIDATE repetition ${i} raw exit code: ${code}"
          done

      - name: Record CANDIDATE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "CANDIDATE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('CANDIDATE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload CANDIDATE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-candidate-full-suite
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
            public-store-*.json
            public-store-*.log
            public-store-*.exit
            focused-target-summary.json
          if-no-files-found: error

  differential-regression-gate:
    name: Differential repeated full-suite regression gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - full-suite-baseline
      - full-suite-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_CANDIDATE_SHA }}

      - name: Download BASE evidence
        uses: actions/download-artifact@v4
        with:
          name: shared-terminal-base-full-suite
          path: differential/base

      - name: Download CANDIDATE evidence
        uses: actions/download-artifact@v4
        with:
          name: shared-terminal-candidate-full-suite
          path: differential/candidate

      - name: Compare repeated BASE vs CANDIDATE failure envelope
        run: |
          node scripts/ci/compare-focused-target-evidence.mjs \
            differential/base/focused-target-summary.json \
            differential/candidate/focused-target-summary.json \
            differential/focused-target-differential.md \
            differential/focused-target-differential.json
          node scripts/compare-shared-terminal-full-suite.mjs \
            differential/base \
            differential/candidate \
            differential/full-suite-differential.md \
            differential/full-suite-differential.json
          cat differential/focused-target-differential.md >> "$GITHUB_STEP_SUMMARY"
          cat differential/full-suite-differential.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-full-suite-differential
          path: |
            differential/full-suite-differential.md
            differential/full-suite-differential.json
            differential/focused-target-differential.md
            differential/focused-target-differential.json
          if-no-files-found: error

  publish-audit-report:
    name: Publish idempotent closeout report
    needs:
      - focused-validation
      - differential-regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/shared-terminal-actor-runtime'
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect report-only HEAD
        id: report_only
        shell: bash
        run: |
          PHASE1_REPORT_PATH="docs/reports/SHARED.TERMINAL.1.ACTOR.RUNTIME.FOUNDATION.md"
          PHASE2_REPORT_PATH="docs/reports/SHARED.TERMINAL.2.DEVICE.ACTOR.AUTH.CUTOVER.md"
          PHASE4_REPORT_PATH="docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md"
          mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)

          if [[ "${#changed_paths[@]}" -eq 1 ]] && \
             [[ "${changed_paths[0]}" == "$PHASE1_REPORT_PATH" || "${changed_paths[0]}" == "$PHASE2_REPORT_PATH" || "${changed_paths[0]}" == "$PHASE4_REPORT_PATH" ]]; then
            echo "report_only=true" >> "$GITHUB_OUTPUT"
            echo "REPORT-ONLY HEAD — validation complete; no republish required."
            exit 0
          fi

          echo "report_only=false" >> "$GITHUB_OUTPUT"

      - name: Download differential evidence
        if: steps.report_only.outputs.report_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: shared-terminal-full-suite-differential
          path: differential

      - name: Generate audit report from exact differential JSON
        if: steps.report_only.outputs.report_only != 'true'
        run: node scripts/generate-shared-terminal-actor-runtime-report.mjs differential/full-suite-differential.json

      - name: Publish report only when content changed
        if: steps.report_only.outputs.report_only != 'true'
        shell: bash
        run: |
          REPORT_PATH="docs/reports/SHARED.TERMINAL.1.ACTOR.RUNTIME.FOUNDATION.md"

          if git ls-files --error-unmatch "$REPORT_PATH" >/dev/null 2>&1; then
            if git diff --quiet -- "$REPORT_PATH"; then
              echo "Audit report already matches the reproducible differential evidence."
              exit 0
            fi
          else
            if [[ ! -f "$REPORT_PATH" ]]; then
              echo "::error::Audit report generation did not create $REPORT_PATH"
              exit 1
            fi
            echo "Audit report is new and will be published."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT_PATH"

          if git diff --cached --quiet -- "$REPORT_PATH"; then
            echo "Audit report produced no staged change; no commit required."
            exit 0
          fi

          git commit -m "docs(shared-terminal): publish actor runtime closeout report"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
