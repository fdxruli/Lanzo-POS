name: Shared Terminal Device Actor Auth Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260818164207_shared_terminal_device_actor_auth.sql'
      - 'supabase/migrations/20260818165736_shared_terminal_legacy_admin_fail_closed.sql'
      - 'supabase/migrations/20260818170333_shared_terminal_secondary_actor_context.sql'
      - 'supabase/migrations/20260818234329_shared_terminal_staff_occupancy_fix.sql'
      - 'supabase/tests/shared_terminal_staff_occupancy_test.sql'
      - 'supabase/functions/authorize-image-upload/index.ts'
      - 'src/services/deviceModePolicy.js'
      - 'src/services/deviceModeService.js'
      - 'src/services/__tests__/deviceModePolicy.test.js'
      - 'src/services/storage/imageUploadService.js'
      - 'src/services/storage/__tests__/imageUploadService.test.js'
      - 'src/services/storage/__tests__/imageUploadService.actorSession.test.js'
      - 'src/components/common/DeviceManager.jsx'
      - 'src/store/slices/license/licenseStaffActions.js'
      - 'src/store/slices/license/__tests__/sharedDeviceModeRouting.test.js'
      - 'scripts/check-shared-terminal-device-actor-auth.mjs'
      - 'docs/reports/SHARED.TERMINAL.2.DEVICE.ACTOR.AUTH.CUTOVER.md'
      - '.github/workflows/shared-terminal-device-actor-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARED_TERMINAL_2_BASE_SHA: cd67e0d0b299cbef1f299e5a3414a3cefe5d3a39
  SHARED_TERMINAL_2_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
  SHARED_TERMINAL_2_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  focused-validation:
    name: Device mode / ActorRuntime / tenant / auth / lint / builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_2_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate comparison refs
        shell: bash
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_2_PR_BASE_SHA}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_2_CANDIDATE_SHA}"
          echo "CONTRACT_BASE_SHA=${SHARED_TERMINAL_2_BASE_SHA}"
          test -n "${SHARED_TERMINAL_2_PR_BASE_SHA}"
          test -n "${SHARED_TERMINAL_2_CANDIDATE_SHA}"
          test -n "${SHARED_TERMINAL_2_BASE_SHA}"
          git cat-file -e "${SHARED_TERMINAL_2_PR_BASE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_2_CANDIDATE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_2_BASE_SHA}^{commit}"

      - name: PR-local blocking whitespace hygiene
        shell: bash
        run: git diff --check "${SHARED_TERMINAL_2_PR_BASE_SHA}...${SHARED_TERMINAL_2_CANDIDATE_SHA}"

      - name: Historical contract-base whitespace observation
        if: always()
        shell: bash
        run: |
          set +e
          git diff --check "${SHARED_TERMINAL_2_BASE_SHA}...${SHARED_TERMINAL_2_CANDIDATE_SHA}"
          historical_status=$?
          set -e

          if [[ "${historical_status}" -eq 0 ]]; then
            echo "Historical contract-base whitespace check: no findings."
          else
            echo "::warning title=Historical contract-base whitespace::Existing findings are observational only and do not block validation."
          fi

          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration + actor authorization contract guard
        run: node scripts/check-shared-terminal-device-actor-auth.mjs

      - name: Shared device focused tests
        run: >-
          npx vitest run
          src/services/__tests__/deviceModePolicy.test.js
          src/store/slices/license/__tests__/sharedDeviceModeRouting.test.js
          src/services/auth/__tests__/actorRuntimeController.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/services/storage/__tests__/imageUploadService.test.js
          src/services/storage/__tests__/imageUploadService.actorSession.test.js
          --maxWorkers=4

      - name: Tenant isolation and recovery regression
        run: npx vitest run src/services/tenant/__tests__ src/services/db/__tests__ --maxWorkers=4

      - name: Authentication regression
        run: npx vitest run src/store/slices/license --maxWorkers=4

      - name: Relevant ESLint
        if: always()
        run: >-
          npx eslint
          src/services/deviceModePolicy.js
          src/services/deviceModeService.js
          src/services/__tests__/deviceModePolicy.test.js
          src/services/storage/imageUploadService.js
          src/services/storage/__tests__/imageUploadService.test.js
          src/services/storage/__tests__/imageUploadService.actorSession.test.js
          src/components/common/DeviceManager.jsx
          src/store/slices/license/licenseStaffActions.js
          src/store/slices/license/__tests__/sharedDeviceModeRouting.test.js
          scripts/check-shared-terminal-device-actor-auth.mjs

      - name: npm run build
        if: always()
        run: npm run build

      - name: npm run build:store
        if: always()
        run: npm run build:store

      - name: npm run build:store:vercel
        if: always()
        run: npm run build:store:vercel

  full-suite-baseline:
    name: Full suite BASE repeated (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact BASE SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_2_BASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build BASE validation artifacts
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: BASE raw full-suite repetitions
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="full-suite-${i}.json" 2>&1 | tee "full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "full-suite-${i}.exit"
            echo "BASE repetition ${i} raw exit code: ${code}"
          done

      - name: Record BASE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "BASE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('BASE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload BASE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-2-base-full-suite
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
          if-no-files-found: error

  full-suite-candidate:
    name: Full suite CANDIDATE repeated (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CANDIDATE validation artifacts
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: CANDIDATE raw full-suite repetitions
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="full-suite-${i}.json" 2>&1 | tee "full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "full-suite-${i}.exit"
            echo "CANDIDATE repetition ${i} raw exit code: ${code}"
          done

      - name: Record CANDIDATE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "CANDIDATE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('CANDIDATE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload CANDIDATE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-2-candidate-full-suite
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
          if-no-files-found: error

  differential-regression-gate:
    name: Differential repeated full-suite regression gate
    if: always()
    needs:
      - full-suite-baseline
      - full-suite-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download BASE evidence
        uses: actions/download-artifact@v4
        with:
          name: shared-terminal-2-base-full-suite
          path: differential/base

      - name: Download CANDIDATE evidence
        uses: actions/download-artifact@v4
        with:
          name: shared-terminal-2-candidate-full-suite
          path: differential/candidate

      - name: Compare repeated BASE vs CANDIDATE failure envelope
        run: |
          node scripts/compare-shared-terminal-full-suite.mjs \
            differential/base \
            differential/candidate \
            differential/full-suite-differential.md \
            differential/full-suite-differential.json
          cat differential/full-suite-differential.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-terminal-2-full-suite-differential
          path: |
            differential/full-suite-differential.md
            differential/full-suite-differential.json
          if-no-files-found: error
