name: Pharmacy Stage 2 PostgreSQL Guard Regression
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261111230000_pharmacy_stage2_inventory_authority.sql'
      - 'scripts/supabase/pharmacy_stage2_pg_regression.py'
      - '.github/workflows/pharmacy-stage2-postgres.yml'
  workflow_dispatch:

jobs:
  pharmacy-stage2-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual migration helpers in isolated PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGSSLMODE: disable
        run: python3 scripts/supabase/pharmacy_stage2_pg_regression.py
