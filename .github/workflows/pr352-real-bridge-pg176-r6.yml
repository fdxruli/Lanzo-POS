name: PR352 R6 real bridge and synthetic ledger overlay PostgreSQL 17.6

on:
  push:
    branches:
      - qa/pr352-real-bridge-pg176-r6-20261030
    paths:
      - '.github/workflows/pr352-real-bridge-pg176-r6.yml'
      - 'docs/evidence/20261030182733_restaurant_cloud_transition_bridge_v1.sql'
      - 'scripts/supabase/pr352-r6-*'
      - 'supabase/migrations/20261026214837_restaurant_sale_dispatcher_guard_3d14.sql'
      - 'supabase/tests/fixtures/pr338-real-financial/**'
      - 'supabase/tests/fixtures/pr352-r6/**'

permissions:
  contents: read

concurrency:
  group: pr352-r6-real-bridge-pg176
  cancel-in-progress: false

jobs:
  isolated-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r6_synthetic_only
          POSTGRES_DB: pr352_bridge_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr352_bridge_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: r6_synthetic_only
      PGDATABASE: pr352_bridge_isolated
      PGCONNECT_TIMEOUT: 5
      PSQL_BIN: psql
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create private evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/pr352-r6-evidence"
          test ! -e "${evidence_dir}"
          install -d -m 700 "${evidence_dir}"
          test "$(stat -c '%a' "${evidence_dir}")" = "700"
          test "$(stat -c '%u' "${evidence_dir}")" = "$(id -u)"

      - name: Validate Node contracts and JavaScript syntax
        id: contracts
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node --version
          node --check scripts/supabase/pr352-r6-real-bridge-pg176-test.mjs
          node --check scripts/supabase/pr352-r6-concurrency.mjs
          node --check scripts/supabase/pr352-r6-real-bridge.node-test.mjs
          node --check scripts/supabase/pr352-r6-synthetic-ledger-overlay.mjs
          node --check scripts/supabase/pr352-r6-synthetic-ledger-overlay-test.mjs
          node --test scripts/supabase/pr352-r6-real-bridge.node-test.mjs

      - name: Install psql client in ephemeral runner if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client
          fi
          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pr352_bridge_isolated

      - name: Apply real 3D.14 and bridge, exercise clients and concurrency
        id: bridge
        shell: bash
        continue-on-error: true
        env:
          PR352_R6_EVIDENCE_DIR: ${{ runner.temp }}/pr352-r6-evidence
        run: node scripts/supabase/pr352-r6-real-bridge-pg176-test.mjs

      - name: Validate 333-version synthetic overlay independently
        id: overlay
        shell: bash
        continue-on-error: true
        env:
          PR352_R6_EVIDENCE_DIR: ${{ runner.temp }}/pr352-r6-evidence
        run: node scripts/supabase/pr352-r6-synthetic-ledger-overlay-test.mjs

      - name: Upload structured JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr352-r6-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pr352-r6-evidence/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require both evidence blocks and static contracts to pass
        if: always()
        shell: bash
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          EXPECTED_EXECUTION_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "${CONTRACTS_OUTCOME}" = "success"
          test "${BRIDGE_OUTCOME}" = "success"
          test "${OVERLAY_OUTCOME}" = "success"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const root = process.env.RUNNER_TEMP + "/pr352-r6-evidence/";
            const bridge = JSON.parse(await readFile(root + "real-bridge.json", "utf8"));
            const overlay = JSON.parse(await readFile(root + "synthetic-overlay.json", "utf8"));
            const expectedSha = process.env.EXPECTED_EXECUTION_SHA;
            const expectedRunId = process.env.EXPECTED_RUN_ID;
            const expectedRunAttempt = process.env.EXPECTED_RUN_ATTEMPT;
            if (!/^[0-9a-f]{40}$/.test(expectedSha ?? "")) process.exit(1);
            if (!/^\d+$/.test(expectedRunId ?? "") || !/^\d+$/.test(expectedRunAttempt ?? "")) process.exit(1);
            if (bridge.commitSha !== expectedSha || overlay.commitSha !== expectedSha) process.exit(1);
            if (bridge.runId !== expectedRunId || bridge.runAttempt !== expectedRunAttempt
              || overlay.runId !== expectedRunId || overlay.runAttempt !== expectedRunAttempt) process.exit(1);
            if (bridge.status !== "PASS" || overlay.status !== "PASS") process.exit(1);
            if (bridge.failedStage !== null || bridge.error !== null || bridge.errorStack !== null || overlay.error != null) process.exit(1);
            if (!Array.isArray(bridge.checks) || bridge.checks.length === 0 || !bridge.checks.every((check) => check && typeof check.name === "string" && check.status === "PASS")) process.exit(1);
            const adminOff = bridge.adminOff;
            const expectedAdminCheckNames = [
              "admin-off-initial-state",
              "admin-off-contract-response",
              "admin-off-setter-rejected-no-state-change",
              "admin-off-private-setter-denied-anon",
              "admin-off-private-setter-denied-authenticated"
            ];
            const adminChecks = bridge.checks.filter((check) => check.name.startsWith("admin-off-"));
            if (adminChecks.length !== expectedAdminCheckNames.length
              || adminChecks.some((check) => !expectedAdminCheckNames.includes(check.name))
              || expectedAdminCheckNames.some((name) => adminChecks.filter((check) => check.name === name).length !== 1)) process.exit(1);
            const uniqueCheck = (name) => {
              const matches = bridge.checks.filter((check) => check.name === name);
              if (matches.length !== 1) process.exit(1);
              return matches[0];
            };
            const catalog = uniqueCheck("Cocina schema and six direct Restaurant helper functions match read-only Production catalog metadata");
            if (catalog.tableColumnCount !== 18 || catalog.constraintCount !== 9 || catalog.indexCount !== 5 || catalog.functionCount !== 6) process.exit(1);
            const dispatcher = uniqueCheck("authentic 3D.14 dispatcher fingerprint matches reviewed read-only fingerprint");
            const dispatcherManifest = JSON.parse(await readFile("supabase/tests/fixtures/pr352-r6/dispatcher-fingerprint.json", "utf8"));
            if (!/^[0-9a-f]{64}$/.test(dispatcher.sha256 ?? "") || dispatcher.sha256 !== dispatcherManifest.entry.sha256) process.exit(1);
            const sourceWriters = uniqueCheck("six authentic Restaurant writer bodies and security metadata match fingerprints");
            const bridgeWriters = uniqueCheck("bridge preserves function OIDs, owners, SECURITY DEFINER, settings, ACL and business bodies");
            if (sourceWriters.writerCount !== 6 || bridgeWriters.instrumentedFunctions !== 10) process.exit(1);
            uniqueCheck("loopback disposable PostgreSQL 17.6 endpoint");
            uniqueCheck("financial schema and captured function snapshot installed");
            uniqueCheck("bridge installation transaction fully rolls back after induced failure");
            const bridgeInstallation = uniqueCheck("forward bridge v1 migration installed and committed in disposable PostgreSQL");
            if (bridgeInstallation.contractStateTablePresent !== true || bridgeInstallation.contractReaderPresent !== true) process.exit(1);
            uniqueCheck("anon/authenticated public grants and private policy setter denial verified");
            uniqueCheck("authentic Cocina provisioning, resolution, attribution, license isolation, rollback and concurrency checks completed");
            uniqueCheck("cutover lock, concurrent commit/rollback, paused write rejection, replay and unrelated sale scenarios completed");
            uniqueCheck("financial settlement races completed with observed parent locks");
            uniqueCheck("Restaurant cancellation scenarios completed");
            uniqueCheck("bridge integration assertions and zero-session cleanup complete");
            const settlement = uniqueCheck("Restaurant settlement and replay materialize one sale, payment, operation and inventory movement");
            if (settlement.receiptsIdentical !== true || settlement.sales !== 1 || settlement.payments !== 1
              || settlement.operations !== 1 || settlement.inventoryMovements !== 1 || settlement.parentPaid !== true) process.exit(1);
            const adminStateCheck = uniqueCheck("admin-off-initial-state");
            const contractCheck = uniqueCheck("admin-off-contract-response");
            const setterCheck = uniqueCheck("admin-off-setter-rejected-no-state-change");
            const anonSetterCheck = uniqueCheck("admin-off-private-setter-denied-anon");
            const authenticatedSetterCheck = uniqueCheck("admin-off-private-setter-denied-authenticated");
            const exactKeys = (value, keys) => value !== null && typeof value === "object" && !Array.isArray(value)
              && Object.keys(value).sort().join("\0") === [...keys].sort().join("\0");
            const validState = (state) => exactKeys(state, ["contractVersion", "writesPaused", "activeActivationRows"])
              && state.contractVersion === 1 && state.writesPaused === false && state.activeActivationRows === 0;
            if (!adminOff || adminOff.status !== "PASS") process.exit(1);
            if (!exactKeys(adminOff, ["status", "initialState", "contractResponse", "setterAttempt", "roleMatrix"])) process.exit(1);
            if (!adminStateCheck || !contractCheck || !setterCheck || !anonSetterCheck || !authenticatedSetterCheck) process.exit(1);
            if (!validState(adminOff.initialState)) process.exit(1);
            if (!exactKeys(adminStateCheck, ["name", "status", "contractVersion", "writesPaused", "activeActivationRows"])) process.exit(1);
            if (adminStateCheck.contractVersion !== 1 || adminStateCheck.writesPaused !== false || adminStateCheck.activeActivationRows !== 0) process.exit(1);
            if (adminStateCheck.contractVersion !== adminOff.initialState.contractVersion || adminStateCheck.writesPaused !== adminOff.initialState.writesPaused || adminStateCheck.activeActivationRows !== adminOff.initialState.activeActivationRows) process.exit(1);
            if (!exactKeys(adminOff.contractResponse, ["success", "contractVersion", "writesPaused", "adminSupervisionAvailable"])) process.exit(1);
            if (!adminOff.contractResponse || adminOff.contractResponse.success !== true || adminOff.contractResponse.contractVersion !== 1 || adminOff.contractResponse.writesPaused !== false || adminOff.contractResponse.adminSupervisionAvailable !== false) process.exit(1);
            if (!exactKeys(contractCheck, ["name", "status", "success", "contractVersion", "writesPaused", "adminSupervisionAvailable"])) process.exit(1);
            if (contractCheck.success !== true || contractCheck.contractVersion !== 1 || contractCheck.writesPaused !== false || contractCheck.adminSupervisionAvailable !== false) process.exit(1);
            if (contractCheck.success !== adminOff.contractResponse.success || contractCheck.contractVersion !== adminOff.contractResponse.contractVersion || contractCheck.writesPaused !== adminOff.contractResponse.writesPaused || contractCheck.adminSupervisionAvailable !== adminOff.contractResponse.adminSupervisionAvailable) process.exit(1);
            if (!exactKeys(adminOff.setterAttempt, ["attempted", "rejected", "errorMessage", "sqlstate", "stateBefore", "stateAfter"])) process.exit(1);
            if (!adminOff.setterAttempt || adminOff.setterAttempt.attempted !== true || adminOff.setterAttempt.rejected !== true || adminOff.setterAttempt.errorMessage !== "RESTAURANT_ADMIN_BACKEND_NOT_AVAILABLE") process.exit(1);
            if (adminOff.setterAttempt.sqlstate !== "P0001" || !validState(adminOff.setterAttempt.stateBefore) || !validState(adminOff.setterAttempt.stateAfter)) process.exit(1);
            if (!exactKeys(setterCheck, ["name", "status", "attempted", "rejected", "errorMessage", "sqlstate", "stateBefore", "stateAfter"])) process.exit(1);
            if (setterCheck.sqlstate !== "P0001" || !validState(setterCheck.stateBefore) || !validState(setterCheck.stateAfter)) process.exit(1);
            if (setterCheck.attempted !== true || setterCheck.rejected !== true || setterCheck.errorMessage !== adminOff.setterAttempt.errorMessage || JSON.stringify(setterCheck.stateBefore) !== JSON.stringify(adminOff.initialState) || JSON.stringify(setterCheck.stateAfter) !== JSON.stringify(adminOff.initialState)) process.exit(1);
            if (!exactKeys(adminOff.roleMatrix, ["anonCanExecuteSetter", "authenticatedCanExecuteSetter", "denials"])) process.exit(1);
            if (adminOff.roleMatrix.anonCanExecuteSetter !== false || adminOff.roleMatrix.authenticatedCanExecuteSetter !== false || !Array.isArray(adminOff.roleMatrix.denials) || adminOff.roleMatrix.denials.length !== 2) process.exit(1);
            const anonDenial = adminOff.roleMatrix.denials.find((denial) => denial.role === "anon");
            const authenticatedDenial = adminOff.roleMatrix.denials.find((denial) => denial.role === "authenticated");
            const expectedRoleDenialMessages = [
              "permission denied for schema private",
              "permission denied for function set_restaurant_transition_policy_v1"
            ];
            if (!exactKeys(anonSetterCheck, ["name", "status", "role", "denialSqlstate", "denialMessage", "stateAfter"]) || !exactKeys(authenticatedSetterCheck, ["name", "status", "role", "denialSqlstate", "denialMessage", "stateAfter"])) process.exit(1);
            const validRoleDenial = (denial, check, role) => exactKeys(denial, ["role", "denialSqlstate", "denialMessage", "stateAfter"])
              && denial.role === role && denial.denialSqlstate === "42501"
              && expectedRoleDenialMessages.includes(denial.denialMessage)
              && validState(denial.stateAfter) && JSON.stringify(denial.stateAfter) === JSON.stringify(adminOff.initialState)
              && check.role === denial.role && check.denialSqlstate === denial.denialSqlstate
              && check.denialMessage === denial.denialMessage && JSON.stringify(check.stateAfter) === JSON.stringify(denial.stateAfter);
            if (!validRoleDenial(anonDenial, anonSetterCheck, "anon")
              || !validRoleDenial(authenticatedDenial, authenticatedSetterCheck, "authenticated")) process.exit(1);
            if (!Array.isArray(bridge.writerChecks) || bridge.writerChecks.length !== 10 || !bridge.writerChecks.every((writer) => writer.status === "PASS" && writer.admissionOccurrences === 1 && writer.bodyRecoveredExactly === true && writer.oidPreserved === true && writer.ownerPreserved === true && writer.securityDefinerPreserved === true && writer.configurationPreserved === true && writer.aclSemanticallyPreserved === true)) process.exit(1);
            const writerSignatures = [
              "public.pos_upsert_restaurant_order_unlimited(text,text,text,text,jsonb,jsonb,text)",
              "public.pos_update_restaurant_order_status_unlimited(text,text,text,text,text,text,text)",
              "public.pos_update_restaurant_order_item_status_unlimited(text,text,text,text,text,text,text,text)",
              "public.pos_close_restaurant_order_after_checkout_unlimited(text,text,text,text,text,text,text,numeric,jsonb,text)",
              "public.pos_archive_restaurant_order_unlimited(text,text,text,text,text,text,jsonb,text)",
              "public.pos_execute_financial_operation_v1(text,text,text,text,text,text,text,jsonb)",
              "public.pos_cancel_restaurant_order_from_pos_v1(text,text,text,text,text,text,text,text)",
              "private.r2b_authorize_sale_financial_request_v1(text,text,text,text,text,jsonb,jsonb,jsonb,text,text,text)",
              "private.execute_split_sale_financial_v1(text,text,text,text,jsonb,text)",
              "private.recalculate_restaurant_order_status(uuid,text)"
            ];
            if (new Set(writerSignatures).size !== 10 || bridge.writerChecks.some((row) => !writerSignatures.includes(row.signature))
              || writerSignatures.some((signature) => bridge.writerChecks.filter((row) => row.signature === signature).length !== 1)) process.exit(1);
            const station = bridge.preparationStationDependencies;
            const stationNames = [
              "A/G: first authenticated Staff write creates and attributes Kitchen",
              "B: active station reuse and authentic resolver fallback",
              "C: inactive station reactivation",
              "D: incomplete station fields repaired without rewriting metadata",
              "E: concurrent creation, independent psql sessions",
              "F: different licenses keep distinct default stations",
              "H: failed transaction rolls back station initialization"
            ];
            if (!station || station.status !== "PASS" || station.initialStationCountBeforeStaffWriter !== 0
              || !Array.isArray(station.cases) || station.cases.length !== stationNames.length
              || stationNames.some((name) => station.cases.filter((row) => row.name === name && row.status === "PASS").length !== 1)) process.exit(1);
            const relationValid = (relation, localOrderId, localLineId) => relation
              && relation.licenseId === "00000000-0000-0000-0000-000000000001"
              && relation.localOrderId === localOrderId && relation.localLineId === localLineId
              && typeof relation.parentId === "string" && relation.parentId.length > 0
              && typeof relation.itemId === "string" && relation.itemId.length > 0
              && relation.itemParentId === relation.parentId && relation.itemLicenseId === relation.licenseId
              && relation.stationCode === "kitchen" && relation.stationName === "Cocina" && relation.activeItemCount === 1;
            const firstStation = station.cases.find((row) => row.name === stationNames[0]);
            if (firstStation.count !== 1 || firstStation.actor?.deviceId !== "00000000-0000-0000-0000-00000000000b"
              || firstStation.actor?.staffUserId !== "00000000-0000-0000-0000-0000000000ab"
              || !relationValid(firstStation.parentItemRelationship, "bridge-staff-owned-parent", "bridge-staff-owned-parent-line")) process.exit(1);
            const stationRace = station.cases.find((row) => row.name === stationNames[4]);
            if (stationRace.sqlSubmittedAndObserved !== true || !Array.isArray(stationRace.sessions)
              || stationRace.sessions.length !== 2 || new Set(stationRace.sessions).size !== 2
              || !Array.isArray(stationRace.observation) || stationRace.observation.length !== 2
              || !stationRace.sessions.every((name) => stationRace.observation.some((row) => row.applicationName === name
                && row.state === "active" && row.waitEventType === "Lock" && row.waitEvent === "advisory" && row.lockGranted === false
                && typeof row.queryText === "string" && row.queryText.includes("ensure_default_preparation_station")))
              || stationRace.controllerLock?.granted !== true || stationRace.controllerExit?.code !== 0
              || !Array.isArray(stationRace.exits) || stationRace.exits.length !== 2
              || !stationRace.exits.every((row) => row.code === 0 && row.signal === null)
              || stationRace.finalStationCount !== 1 || stationRace.pendingSessionCount !== 0) process.exit(1);
            uniqueCheck("Staff owner admitted; Admin and another Staff denied while Admin remains OFF; invalid session has no effect");
            const clients = uniqueCheck("legacy and versioned clients persist and replay one correctly licensed parent and item");
            const observer = uniqueCheck("private insertion witness has restricted ACL, RLS and an enabled authentic-ledger observer");
            if (observer.table !== "pos_idempotency_keys" || observer.type !== 5 || observer.enabled !== "O"
              || observer.securityDefiner !== true || observer.owner !== "postgres" || observer.browserExecute !== false
              || JSON.stringify(observer.config) !== JSON.stringify(["search_path=\"\""])) process.exit(1);
            uniqueCheck("prior legacy ledger rejected without attribution and unsuccessful writer response cleans its attempt");
            const diagnosis = uniqueCheck("authentic writer provenance diagnostic records every original rejection predicate");
            const diagnostic = bridge.provenanceDiagnostic;
            const predicateNames = ["sameTopLevelXid","ledgerPresent","completed","operationMatches","entityMatches","md5Matches","receiptMatches","parentMatches"];
            if (!diagnostic || typeof diagnostic.topLevelXid !== "string" || typeof diagnostic.observedLedgerXmin !== "string"
              || !/^\d+$/.test(diagnostic.topLevelXid) || !/^\d+$/.test(diagnostic.observedLedgerXmin)
              || diagnostic.writerSuccess !== true || diagnostic.ledgerStatus !== "completed" || diagnostic.operation !== "restaurant_order.upsert"
              || !/^[0-9a-f]{64}$/.test(diagnostic.receiptSha256 ?? "")
              || !exactKeys(diagnostic.predicates,predicateNames)
              || predicateNames.some((name) => typeof diagnostic.predicates[name] !== "boolean" || (name !== "sameTopLevelXid" && !diagnostic.predicates[name]))
              || JSON.stringify(diagnostic.failedPredicates) !== JSON.stringify(predicateNames.filter((name) => !diagnostic.predicates[name]))
              || diagnosis.topLevelXid !== diagnostic.topLevelXid || diagnosis.observedLedgerXmin !== diagnostic.observedLedgerXmin
              || JSON.stringify(diagnosis.predicates) !== JSON.stringify(diagnostic.predicates)) process.exit(1);
            if (diagnostic.subtransactionHypothesis !== (diagnostic.predicates.sameTopLevelXid ? "NOT_REPRODUCED" : "DISTINCT_XIDS_OBSERVED")) process.exit(1);
            const idem = uniqueCheck("versioned idempotency binds the strong request proof, preserves the authentic rate-limit and rejects conflicts");
            const provenance = bridge.idempotency?.provenance;
            if (bridge.idempotency?.status !== "PASS" || !provenance || provenance.mechanism !== "private call nonce witnessed by authentic ledger INSERT"
              || JSON.stringify(provenance) !== JSON.stringify(idem.provenance)
              || JSON.stringify(provenance.diagnostic) !== JSON.stringify(diagnostic)
              || provenance.xidProbe?.proofs !== 1 || provenance.xidProbe?.pendingAttempts !== 0) process.exit(1);
            const legacyNames = ["legacy-first-same-parent","versioned-first-legacy-same-parent","legacy-first-cross-parent","foreign-completed-receipt-no-insert"];
            const legacy = bridge.legacyProvenance;
            if (!Array.isArray(legacy) || legacy.length !== legacyNames.length || JSON.stringify(legacy) !== JSON.stringify(provenance.legacy)
              || legacyNames.some((name) => legacy.filter((row) => row.name === name).length !== 1)) process.exit(1);
            for (const row of legacy) {
              const rejected = row.name === "legacy-first-cross-parent" || row.name === "foreign-completed-receipt-no-insert";
              if (row.status !== "PASS" || row.queriesSubmitted !== true || !Number.isInteger(row.holderPid) || !Number.isInteger(row.contenderPid)
                || row.holderPid <= 0 || row.contenderPid <= 0 || row.holderPid === row.contenderPid
                || row.wait?.pid !== row.contenderPid || row.wait?.waitEventType !== "Lock" || !row.wait?.blockedBy?.includes(row.holderPid)
                || !Array.isArray(row.locks) || !row.locks.some((lock) => lock.pid === row.contenderPid && lock.granted === false)
                || row.wait.waitEvent !== (rejected ? "transactionid" : "advisory")
                || (rejected && (!Array.isArray(row.keyLocks) || !row.keyLocks.some((lock) => lock.granted === true)))
                || !exactKeys(row.financialBefore,["sales","payments","cash","inventory","credit","operations"])
                || Object.values(row.financialBefore).some((value) => !Number.isInteger(value) || value < 0)
                || JSON.stringify(row.financialBefore) !== JSON.stringify(row.financialAfter)
                || row.exitCodes?.holder !== 0 || row.exitCodes?.contender !== (rejected ? 1 : 0) || row.sqlstate !== (rejected ? "P0001" : "00000")
                || row.finalState?.parents !== 1 || row.finalState?.items !== 1 || row.finalState?.ledger !== 1
                || row.finalState?.proofs !== (row.name === "versioned-first-legacy-same-parent" ? 1 : 0)
                || row.finalState?.attempts !== 0 || row.pendingDatabaseSessions !== 0) process.exit(1);
            }
            if (clients.legacy?.role !== "service_role" || clients.versioned?.role !== "anon"
              || !relationValid(clients.legacy.relationship, "bridge-legacy-client", "bridge-legacy-line")
              || !relationValid(clients.versioned.relationship, "bridge-versioned-client", "bridge-versioned-line")) process.exit(1);
            const requiredCutoverScenarios = {
              CUTOVER_COMMIT_RACE: "in-flight real writer commits, pause waits exclusively, new writer rejects",
              UNRELATED_RUBRIC_CONTINUITY: "unrelated cashier financial operation completes while Restaurant transition is paused",
              CUTOVER_ROLLBACK_RACE: "in-flight real writer rolls back and releases shared lock for pause",
              POST_RESUME_REPLAY: "replay after resume commits exactly once after concurrent rollback"
            };
            if (!Array.isArray(bridge.concurrency) || bridge.concurrency.length !== 4
              || Object.entries(requiredCutoverScenarios).some(([category, name]) => bridge.concurrency.filter((row) =>
                row.category === category && row.name === name && row.status === "PASS").length !== 1)) process.exit(1);
            const scenario = (category) => bridge.concurrency.find((row) => row.category === category);
            const cutoverLocksValid = (row, includeNewWriter) => {
              const evidence = row.lockObservations;
              const held = evidence?.holderGranted?.find((lock) => lock.granted === true && lock.mode === "ShareLock");
              const waiting = evidence?.pauseWaiting?.find((lock) => lock.granted === false && lock.mode === "ExclusiveLock");
              const sameKey = (a, b) => a && b && a.locktype === "advisory" && b.locktype === "advisory"
                && Number.isInteger(a.pid) && Number.isInteger(b.pid) && a.pid !== b.pid
                && Number.isInteger(a.classId) && Number.isInteger(a.objectId) && a.objectSubId === 1
                && a.classId === b.classId && a.objectId === b.objectId && a.objectSubId === b.objectSubId;
              if (!sameKey(held, waiting) || !evidence.holderActivity?.some((activity) => activity.pid === held.pid
                && activity.state === "idle in transaction" && activity.queryText?.includes("pos_update_restaurant_order_status_unlimited"))
                || !evidence.pauseActivity?.some((activity) => activity.pid === waiting.pid && activity.state === "active"
                  && activity.waitEventType === "Lock" && activity.blockedBy?.includes(held.pid))) return false;
              if (includeNewWriter) {
