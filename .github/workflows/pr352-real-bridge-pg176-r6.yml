name: PR352 R6 real bridge and synthetic ledger overlay PostgreSQL 17.6

on:
  push:
    branches:
      - qa/pr352-real-bridge-pg176-r6-20261030
    paths:
      - '.github/workflows/pr352-real-bridge-pg176-r6.yml'
      - 'docs/evidence/20261030182733_restaurant_cloud_transition_bridge_v1.sql'
      - 'scripts/supabase/pr352-r6-*'
      - 'supabase/migrations/20261026214837_restaurant_sale_dispatcher_guard_3d14.sql'
      - 'supabase/tests/fixtures/pr338-real-financial/**'
      - 'supabase/tests/fixtures/pr352-r6/**'

permissions:
  contents: read

concurrency:
  group: pr352-r6-real-bridge-pg176
  cancel-in-progress: false

jobs:
  isolated-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r6_synthetic_only
          POSTGRES_DB: pr352_bridge_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr352_bridge_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: r6_synthetic_only
      PGDATABASE: pr352_bridge_isolated
      PGCONNECT_TIMEOUT: 5
      PSQL_BIN: psql
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create private evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/pr352-r6-evidence"
          test ! -e "${evidence_dir}"
          install -d -m 700 "${evidence_dir}"
          test "$(stat -c '%a' "${evidence_dir}")" = "700"
          test "$(stat -c '%u' "${evidence_dir}")" = "$(id -u)"

      - name: Validate Node contracts and JavaScript syntax
        id: contracts
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node --version
          node --check scripts/supabase/pr352-r6-real-bridge-pg176-test.mjs
          node --check scripts/supabase/pr352-r6-concurrency.mjs
          node --check scripts/supabase/pr352-r6-real-bridge.node-test.mjs
          node --check scripts/supabase/pr352-r6-synthetic-ledger-overlay.mjs
          node --check scripts/supabase/pr352-r6-synthetic-ledger-overlay-test.mjs
          node --test scripts/supabase/pr352-r6-real-bridge.node-test.mjs

      - name: Install psql client in ephemeral runner if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client
          fi
          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d pr352_bridge_isolated

      - name: Apply real 3D.14 and bridge, exercise clients and concurrency
        id: bridge
        shell: bash
        continue-on-error: true
        env:
          PR352_R6_EVIDENCE_DIR: ${{ runner.temp }}/pr352-r6-evidence
        run: node scripts/supabase/pr352-r6-real-bridge-pg176-test.mjs

      - name: Validate 333-version synthetic overlay independently
        id: overlay
        shell: bash
        continue-on-error: true
        env:
          PR352_R6_EVIDENCE_DIR: ${{ runner.temp }}/pr352-r6-evidence
        run: node scripts/supabase/pr352-r6-synthetic-ledger-overlay-test.mjs

      - name: Upload structured JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr352-r6-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pr352-r6-evidence/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require both evidence blocks and static contracts to pass
        if: always()
        shell: bash
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          EXPECTED_EXECUTION_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "${CONTRACTS_OUTCOME}" = "success"
          test "${BRIDGE_OUTCOME}" = "success"
          test "${OVERLAY_OUTCOME}" = "success"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const root = process.env.RUNNER_TEMP + "/pr352-r6-evidence/";
            const bridge = JSON.parse(await readFile(root + "real-bridge.json", "utf8"));
            const overlay = JSON.parse(await readFile(root + "synthetic-overlay.json", "utf8"));
            const expectedSha = process.env.EXPECTED_EXECUTION_SHA;
            const expectedRunId = process.env.EXPECTED_RUN_ID;
            const expectedRunAttempt = process.env.EXPECTED_RUN_ATTEMPT;
            if (!/^[0-9a-f]{40}$/.test(expectedSha ?? "")) process.exit(1);
            if (!/^\d+$/.test(expectedRunId ?? "") || !/^\d+$/.test(expectedRunAttempt ?? "")) process.exit(1);
            if (bridge.commitSha !== expectedSha || overlay.commitSha !== expectedSha) process.exit(1);
            if (bridge.runId !== expectedRunId || bridge.runAttempt !== expectedRunAttempt) process.exit(1);
            if (bridge.status !== "PASS" || overlay.status !== "PASS") process.exit(1);
            if (bridge.failedStage !== null || bridge.error !== null || bridge.errorStack !== null || overlay.error != null) process.exit(1);
            if (!Array.isArray(bridge.checks) || bridge.checks.length === 0 || !bridge.checks.every((check) => check && typeof check.name === "string" && check.status === "PASS")) process.exit(1);
            const adminOff = bridge.adminOff;
            const expectedAdminCheckNames = [
              "admin-off-initial-state",
              "admin-off-contract-response",
              "admin-off-setter-rejected-no-state-change",
              "admin-off-private-setter-denied-anon",
              "admin-off-private-setter-denied-authenticated"
            ];
            const adminChecks = bridge.checks.filter((check) => check.name.startsWith("admin-off-"));
            if (adminChecks.length !== expectedAdminCheckNames.length
              || adminChecks.some((check) => !expectedAdminCheckNames.includes(check.name))
              || expectedAdminCheckNames.some((name) => adminChecks.filter((check) => check.name === name).length !== 1)) process.exit(1);
            const uniqueCheck = (name) => {
              const matches = bridge.checks.filter((check) => check.name === name);
              if (matches.length !== 1) process.exit(1);
              return matches[0];
            };
            const adminStateCheck = uniqueCheck("admin-off-initial-state");
            const contractCheck = uniqueCheck("admin-off-contract-response");
            const setterCheck = uniqueCheck("admin-off-setter-rejected-no-state-change");
            const anonSetterCheck = uniqueCheck("admin-off-private-setter-denied-anon");
            const authenticatedSetterCheck = uniqueCheck("admin-off-private-setter-denied-authenticated");
            const exactKeys = (value, keys) => value !== null && typeof value === "object" && !Array.isArray(value)
              && Object.keys(value).sort().join("\0") === [...keys].sort().join("\0");
            const validState = (state) => exactKeys(state, ["contractVersion", "writesPaused", "activeActivationRows"])
              && state.contractVersion === 1 && state.writesPaused === false && state.activeActivationRows === 0;
            if (!adminOff || adminOff.status !== "PASS") process.exit(1);
            if (!exactKeys(adminOff, ["status", "initialState", "contractResponse", "setterAttempt", "roleMatrix"])) process.exit(1);
            if (!adminStateCheck || !contractCheck || !setterCheck || !anonSetterCheck || !authenticatedSetterCheck) process.exit(1);
            if (!validState(adminOff.initialState)) process.exit(1);
            if (!exactKeys(adminStateCheck, ["name", "status", "contractVersion", "writesPaused", "activeActivationRows"])) process.exit(1);
            if (adminStateCheck.contractVersion !== 1 || adminStateCheck.writesPaused !== false || adminStateCheck.activeActivationRows !== 0) process.exit(1);
            if (adminStateCheck.contractVersion !== adminOff.initialState.contractVersion || adminStateCheck.writesPaused !== adminOff.initialState.writesPaused || adminStateCheck.activeActivationRows !== adminOff.initialState.activeActivationRows) process.exit(1);
            if (!exactKeys(adminOff.contractResponse, ["success", "contractVersion", "writesPaused", "adminSupervisionAvailable"])) process.exit(1);
            if (!adminOff.contractResponse || adminOff.contractResponse.success !== true || adminOff.contractResponse.contractVersion !== 1 || adminOff.contractResponse.writesPaused !== false || adminOff.contractResponse.adminSupervisionAvailable !== false) process.exit(1);
            if (!exactKeys(contractCheck, ["name", "status", "success", "contractVersion", "writesPaused", "adminSupervisionAvailable"])) process.exit(1);
            if (contractCheck.success !== true || contractCheck.contractVersion !== 1 || contractCheck.writesPaused !== false || contractCheck.adminSupervisionAvailable !== false) process.exit(1);
            if (contractCheck.success !== adminOff.contractResponse.success || contractCheck.contractVersion !== adminOff.contractResponse.contractVersion || contractCheck.writesPaused !== adminOff.contractResponse.writesPaused || contractCheck.adminSupervisionAvailable !== adminOff.contractResponse.adminSupervisionAvailable) process.exit(1);
            if (!exactKeys(adminOff.setterAttempt, ["attempted", "rejected", "errorMessage", "sqlstate", "stateBefore", "stateAfter"])) process.exit(1);
            if (!adminOff.setterAttempt || adminOff.setterAttempt.attempted !== true || adminOff.setterAttempt.rejected !== true || adminOff.setterAttempt.errorMessage !== "RESTAURANT_ADMIN_BACKEND_NOT_AVAILABLE") process.exit(1);
            if (adminOff.setterAttempt.sqlstate !== "P0001" || !validState(adminOff.setterAttempt.stateBefore) || !validState(adminOff.setterAttempt.stateAfter)) process.exit(1);
            if (!exactKeys(setterCheck, ["name", "status", "attempted", "rejected", "errorMessage", "sqlstate", "stateBefore", "stateAfter"])) process.exit(1);
            if (setterCheck.sqlstate !== "P0001" || !validState(setterCheck.stateBefore) || !validState(setterCheck.stateAfter)) process.exit(1);
            if (setterCheck.attempted !== true || setterCheck.rejected !== true || setterCheck.errorMessage !== adminOff.setterAttempt.errorMessage || JSON.stringify(setterCheck.stateBefore) !== JSON.stringify(adminOff.initialState) || JSON.stringify(setterCheck.stateAfter) !== JSON.stringify(adminOff.initialState)) process.exit(1);
            if (!exactKeys(adminOff.roleMatrix, ["anonCanExecuteSetter", "authenticatedCanExecuteSetter", "denials"])) process.exit(1);
            if (adminOff.roleMatrix.anonCanExecuteSetter !== false || adminOff.roleMatrix.authenticatedCanExecuteSetter !== false || !Array.isArray(adminOff.roleMatrix.denials) || adminOff.roleMatrix.denials.length !== 2) process.exit(1);
            const anonDenial = adminOff.roleMatrix.denials.find((denial) => denial.role === "anon");
            const authenticatedDenial = adminOff.roleMatrix.denials.find((denial) => denial.role === "authenticated");
            const expectedRoleDenialMessages = [
              "permission denied for schema private",
              "permission denied for function set_restaurant_transition_policy_v1"
            ];
            if (!exactKeys(anonSetterCheck, ["name", "status", "role", "denialSqlstate", "denialMessage", "stateAfter"]) || !exactKeys(authenticatedSetterCheck, ["name", "status", "role", "denialSqlstate", "denialMessage", "stateAfter"])) process.exit(1);
            const validRoleDenial = (denial, check, role) => exactKeys(denial, ["role", "denialSqlstate", "denialMessage", "stateAfter"])
              && denial.role === role && denial.denialSqlstate === "42501"
              && expectedRoleDenialMessages.includes(denial.denialMessage)
              && validState(denial.stateAfter) && JSON.stringify(denial.stateAfter) === JSON.stringify(adminOff.initialState)
              && check.role === denial.role && check.denialSqlstate === denial.denialSqlstate
              && check.denialMessage === denial.denialMessage && JSON.stringify(check.stateAfter) === JSON.stringify(denial.stateAfter);
            if (!validRoleDenial(anonDenial, anonSetterCheck, "anon")
              || !validRoleDenial(authenticatedDenial, authenticatedSetterCheck, "authenticated")) process.exit(1);
            if (!Array.isArray(bridge.writerChecks) || bridge.writerChecks.length !== 10 || !bridge.writerChecks.every((writer) => writer.status === "PASS" && writer.admissionOccurrences === 1 && writer.bodyRecoveredExactly && writer.oidPreserved && writer.ownerPreserved && writer.securityDefinerPreserved && writer.configurationPreserved && writer.aclSemanticallyPreserved)) process.exit(1);
            if (!Array.isArray(bridge.concurrency) || bridge.concurrency.length !== 4 || !bridge.concurrency.every((scenario) => scenario.status === "PASS")) process.exit(1);
            if (bridge.postgresServerVersionNum !== "170006" || bridge.productionConnections !== 0) process.exit(1);
            if (!Array.isArray(overlay.cases) || overlay.cases.length !== overlay.caseCount || !overlay.cases.every((scenario) => scenario.status === "PASS")) process.exit(1);
            if (overlay.expectedLedgerRows !== 333 || overlay.caseCount !== 13 || overlay.caseCount !== overlay.passed || overlay.failed !== 0) process.exit(1);
            if (overlay.productionConnections !== 0 || overlay.cleanupFailures !== 0 || overlay.sqlContentsEmitted !== false) process.exit(1);
            console.log("PR352_R6_EVIDENCE_PASS", JSON.stringify({
              commitSha: expectedSha,
              runId: expectedRunId,
              runAttempt: expectedRunAttempt,
              bridge: bridge.status,
              overlay: overlay.status,
              bridgeChecks: bridge.checks.length,
              concurrencyScenarios: bridge.concurrency.length,
              overlayCases: overlay.caseCount,
              postgresServerVersionNum: bridge.postgresServerVersionNum,
              syntheticLedgerRows: overlay.expectedLedgerRows
            }));
          '
