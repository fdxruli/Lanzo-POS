name: PR127 Global Comparison

on:
  push:
    branches:
      - hotfix/dexie-primary-key-recovery-admin-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-global-suite:
    name: compare-global-suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: pr

      - name: Checkout main base
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PR dependencies
        working-directory: pr
        run: npm ci

      - name: Install main dependencies
        working-directory: main
        run: npm ci

      - name: Run PR global suite
        id: pr-suite
        continue-on-error: true
        working-directory: pr
        run: npm run test:ci -- --reporter=json --outputFile=global-pr.json

      - name: Run main global suite
        id: main-suite
        continue-on-error: true
        working-directory: main
        run: npm run test:ci -- --reporter=json --outputFile=global-main.json

      - name: Normalize and compare failures
        env:
          PR_OUTCOME: ${{ steps.pr-suite.outcome }}
          MAIN_OUTCOME: ${{ steps.main-suite.outcome }}
          PR_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p comparison
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const readReport = (file) => {
            if (!fs.existsSync(file)) return null;
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          };

          const normalizeFailures = (report, source) => {
            if (!report) return [`__${source}_RUNNER__:missing_json_report`];
            const failures = new Set();
            for (const file of report.testResults || []) {
              const assertions = file.assertionResults || [];
              for (const assertion of assertions) {
                if (assertion.status === 'failed') {
                  const name = assertion.fullName || assertion.title || 'unknown test';
                  failures.add(`${file.name || 'unknown file'}::${name}`);
                }
              }
              if (file.status === 'failed' && assertions.length === 0) {
                failures.add(`${file.name || 'unknown file'}::__FILE_FAILURE__`);
              }
            }
            return [...failures].sort();
          };

          const prReport = readReport(path.join('pr', 'global-pr.json'));
          const mainReport = readReport(path.join('main', 'global-main.json'));
          const prFailures = normalizeFailures(prReport, 'PR');
          const mainFailures = normalizeFailures(mainReport, 'MAIN');
          const prSet = new Set(prFailures);
          const mainSet = new Set(mainFailures);
          const sharedFailures = prFailures.filter((failure) => mainSet.has(failure));
          const newFailures = prFailures.filter((failure) => !mainSet.has(failure));
          const resolvedFailures = mainFailures.filter((failure) => !prSet.has(failure));

          const result = {
            prSha: process.env.PR_SHA,
            mainRef: 'main',
            prOutcome: process.env.PR_OUTCOME,
            mainOutcome: process.env.MAIN_OUTCOME,
            prFailures,
            mainFailures,
            sharedFailures,
            newFailures,
            resolvedFailures
          };
          fs.writeFileSync('comparison/global-comparison.json', JSON.stringify(result, null, 2));

          const lines = [
            '# PR #127 global comparison',
            '',
            `- PR SHA: ${result.prSha}`,
            `- PR outcome: ${result.prOutcome}`,
            `- main outcome: ${result.mainOutcome}`,
            `- shared failures: ${sharedFailures.length}`,
            `- new failures: ${newFailures.length}`,
            `- resolved failures: ${resolvedFailures.length}`,
            '',
            '## Shared failures',
            ...(sharedFailures.length ? sharedFailures.map((item) => `- ${item}`) : ['- None']),
            '',
            '## New failures',
            ...(newFailures.length ? newFailures.map((item) => `- ${item}`) : ['- None']),
            '',
            '## Resolved failures',
            ...(resolvedFailures.length ? resolvedFailures.map((item) => `- ${item}`) : ['- None'])
          ];
          fs.writeFileSync('comparison/global-comparison.md', `${lines.join('\n')}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);

          if (!prReport || !mainReport || newFailures.length > 0) process.exit(1);
          NODE

      - name: Upload normalized comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr127-global-comparison-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: comparison/
          if-no-files-found: error
          retention-days: 14
