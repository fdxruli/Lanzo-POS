name: PR127 Global Comparison

on:
  push:
    branches:
      - hotfix/dexie-primary-key-recovery-admin-bootstrap
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - '.github/workflows/hotfix-dexie-validation.yml'
      - '.github/workflows/pr127-global-comparison.yml'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - '.github/workflows/hotfix-dexie-validation.yml'
      - '.github/workflows/pr127-global-comparison.yml'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-global-suite:
    name: compare-global-suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: pr

      - name: Checkout main base
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PR dependencies
        working-directory: pr
        run: npm ci

      - name: Install main dependencies
        working-directory: main
        run: npm ci

      - name: Run PR global suite
        id: pr-suite
        continue-on-error: true
        working-directory: pr
        run: npm run test:ci -- --reporter=json --outputFile=global-pr.json

      - name: Run main global suite
        id: main-suite
        continue-on-error: true
        working-directory: main
        run: npm run test:ci -- --reporter=json --outputFile=global-main.json

      - name: Extract error-aware candidate-only failures
        id: phase-one
        working-directory: pr
        continue-on-error: true
        run: |
          mkdir -p ../comparison
          node scripts/ci/pr127-global-comparison.mjs extract \
            --candidate global-pr.json \
            --base ../main/global-main.json \
            --output ../comparison/phase-one.json

      - name: Run PR focused evidence for candidate-only failures
        if: steps.phase-one.outcome == 'success'
        working-directory: pr
        run: |
          node scripts/ci/pr127-focused-evidence.mjs \
            --targets ../comparison/targets.json \
            --output-dir ../comparison/focused/pr \
            --repetitions 20 \
            --max-workers 4

      - name: Run base focused evidence for candidate-only failures
        if: steps.phase-one.outcome == 'success'
        working-directory: main
        run: |
          node ../pr/scripts/ci/pr127-focused-evidence.mjs \
            --targets ../comparison/targets.json \
            --output-dir ../comparison/focused/main \
            --repetitions 20 \
            --max-workers 4

      - name: Normalize and compare failures
        env:
          PR_OUTCOME: ${{ steps.pr-suite.outcome }}
          MAIN_OUTCOME: ${{ steps.main-suite.outcome }}
          PR_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node pr/scripts/ci/pr127-global-comparison.mjs classify \
            --phase comparison/phase-one.json \
            --base-focused comparison/focused/main \
            --candidate-focused comparison/focused/pr \
            --output comparison/global-comparison.json

      - name: Upload normalized comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr127-global-comparison-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: comparison/
          if-no-files-found: error
          retention-days: 14
