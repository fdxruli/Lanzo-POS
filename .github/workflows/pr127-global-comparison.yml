name: PR127 Global Comparison

on:
  push:
    branches:
      - hotfix/dexie-primary-key-recovery-admin-bootstrap
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - '.github/workflows/hotfix-dexie-validation.yml'
      - '.github/workflows/pr127-global-comparison.yml'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - '.github/workflows/hotfix-dexie-validation.yml'
      - '.github/workflows/pr127-global-comparison.yml'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch/ref for the immutable BASE/CANDIDATE comparison'
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  PR127_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR127_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref || github.event.repository.default_branch }}

jobs:
  compare-global-suite:
    name: compare-global-suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR127_CANDIDATE_SHA }}
          path: pr

      - name: Checkout immutable BASE
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR127_BASE_REF }}
          path: base

      - name: Validate immutable comparison refs
        shell: bash
        run: |
          candidate_sha="$(git -C pr rev-parse HEAD)"
          base_sha="$(git -C base rev-parse HEAD)"
          echo "PR127_CANDIDATE_SHA=${candidate_sha}"
          echo "PR127_BASE_SHA=${base_sha}"
          test "${candidate_sha}" = "${PR127_CANDIDATE_SHA}"
          git -C base cat-file -e "${base_sha}^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PR dependencies
        working-directory: pr
        run: npm ci

      - name: Install BASE dependencies
        working-directory: base
        run: npm ci

      - name: Run PR global suite
        id: pr-suite
        continue-on-error: true
        working-directory: pr
        run: npm run test:ci -- --reporter=json --outputFile=global-pr.json

      - name: Run BASE global suite
        id: base-suite
        continue-on-error: true
        working-directory: base
        run: npm run test:ci -- --reporter=json --outputFile=global-base.json

      - name: Extract error-aware candidate-only failures
        id: phase-one
        working-directory: pr
        continue-on-error: true
        run: |
          mkdir -p ../comparison
          node scripts/ci/pr127-global-comparison.mjs extract \
            --candidate global-pr.json \
            --base ../base/global-base.json \
            --output ../comparison/phase-one.json

      - name: Run PR focused evidence for candidate-only failures
        if: steps.phase-one.outcome == 'success'
        working-directory: pr
        run: |
          node scripts/ci/pr127-focused-evidence.mjs \
            --targets ../comparison/targets.json \
            --output-dir ../comparison/focused/pr \
            --repetitions 20 \
            --max-workers 4

      - name: Run BASE focused evidence for candidate-only failures
        if: steps.phase-one.outcome == 'success'
        working-directory: base
        run: |
          node ../pr/scripts/ci/pr127-focused-evidence.mjs \
            --targets ../comparison/targets.json \
            --output-dir ../comparison/focused/base \
            --repetitions 20 \
            --max-workers 4

      - name: Normalize and compare failures
        env:
          PR_OUTCOME: ${{ steps.pr-suite.outcome }}
          BASE_OUTCOME: ${{ steps.base-suite.outcome }}
          PR_SHA: ${{ env.PR127_CANDIDATE_SHA }}
          BASE_SHA: ${{ env.PR127_BASE_REF }}
        run: |
          node pr/scripts/ci/pr127-global-comparison.mjs classify \
            --phase comparison/phase-one.json \
            --base-focused comparison/focused/base \
            --candidate-focused comparison/focused/pr \
            --output comparison/global-comparison.json

      - name: Upload normalized comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr127-global-comparison-${{ env.PR127_CANDIDATE_SHA }}
          path: comparison/
          if-no-files-found: error
          retention-days: 14
