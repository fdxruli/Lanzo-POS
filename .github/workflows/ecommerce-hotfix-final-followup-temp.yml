name: Ecommerce PR287 Final Follow-up Temporary

on:
  push:
    branches:
      - fix/ecommerce-product-publish-modal-state-r1

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/ecommerce-product-publish-modal-state-r1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply surgical PR287 follow-up
        run: python .github/scripts/ecommerce_pr287_followup_temp.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused ecommerce lifecycle and regression tests
        run: >-
          npm run test:ci --
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.catalogLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.stockMode.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.configurationSync.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          src/utils/__tests__/ecommerceWholesalePricing.test.js
          src/utils/__tests__/businessCapabilities.test.js

      - name: Focal ESLint zero-warning gate
        run: >-
          npx eslint --max-warnings=0
          src/components/ecommerce/EcommercePortalSettings.jsx
          src/components/ecommerce/EcommerceProductPublishModal.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.catalogLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.stockMode.test.jsx
          src/components/ecommerce/__tests__/EcommerceProductPublishModal.configurationSync.test.jsx

      - name: Diff check
        run: git diff --check origin/main...HEAD && git diff --check

      - name: Production build
        run: npm run build

      - name: Commit validated correction and remove temporary helpers
        shell: bash
        run: |
          git rm .github/workflows/ecommerce-hotfix-final-followup-temp.yml
          git rm .github/scripts/ecommerce_pr287_followup_temp.py
          git config user.name "fdxruli"
          git config user.email "48109415+fdxruli@users.noreply.github.com"
          git add src/components/ecommerce/EcommercePortalSettings.jsx
          git add src/components/ecommerce/__tests__/EcommercePortalSettings.productModalLifecycle.test.jsx
          git diff --cached --check
          git commit -m "fix(ecommerce): close catalog loading race"
          git push origin HEAD:fix/ecommerce-product-publish-modal-state-r1
