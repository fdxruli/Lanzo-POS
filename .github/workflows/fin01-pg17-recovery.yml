name: FIN-01 PostgreSQL 17 isolated recovery lab

on:
  push:
    branches:
      - lab/fin01-pg17-recovery-20261029

permissions:
  contents: read

concurrency:
  group: fin01-pg17-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pay-n01-baseline:
    if: github.ref == 'refs/heads/lab/fin01-pg17-recovery-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55847:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
      - name: Verify exact lab ref and preserved base trees
        env:
          FIN01_MAIN_SHA: 1a0d758d09310f2914c475c37d358c4cf885cc01
          FIN01_CANDIDATE_COMMIT: d2af51d0636b0e83fad924f08c6e688b2e2bfb5e
          FIN01_WORKFLOW_COMMIT: 2aab313c4948110402d6fea77c399605427ea12b
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/lab/fin01-pg17-recovery-20261029"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${FIN01_MAIN_SHA}^{tree}")" = "6e5e6f1c77a55cec4cafee016cbe277aab89bf30"
          test "$(git rev-parse "${FIN01_CANDIDATE_COMMIT}^")" = "${FIN01_MAIN_SHA}"
          test "$(git rev-parse "${FIN01_CANDIDATE_COMMIT}^{tree}")" = "a04237a9e7e0a07b52a3c2247b8affff94f30a32"
          test "$(git rev-parse "${FIN01_WORKFLOW_COMMIT}^")" = "${FIN01_CANDIDATE_COMMIT}"
          test "$(git rev-parse "${FIN01_WORKFLOW_COMMIT}^{tree}")" = "19a3525723449fb5764f075c3d18ab92ff34c165"
          git merge-base --is-ancestor "${FIN01_WORKFLOW_COMMIT}" HEAD
          test "$(sha256sum scripts/fin01/fin01-pay-n01-candidate.sql | cut -d ' ' -f 1)" = "de269931a034e9df25ff50ed321f6ab6a0cc23e93fe37f0255c64ed3e780b804"
      - name: Prepare disposable synthetic PostgreSQL fixture
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          mkdir -p artifacts/fin01/logs
          bash scripts/fin01/prepare-postgres-lab.sh fin01_cert_baseline 2>&1 | tee artifacts/fin01/logs/setup.log
      - name: Reproduce exact PAY-N01 baseline defect
        run: |
          set -o pipefail
          node scripts/fin01/run-pay-n01-baseline.mjs 2>&1 | tee artifacts/fin01/logs/pay-n01-baseline.log
      - name: Capture PostgreSQL service log
        if: always()
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts/fin01/logs
          docker logs "${PG_CONTAINER_ID}" > artifacts/fin01/logs/postgres.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fin01-pg17-pay-n01-baseline
          path: |
            artifacts/fin01/**
            docs/reports/fin01-r22/fin01-pay-n01-baseline.json
            docs/reports/fin01-r22/fixture-boundaries.json
          if-no-files-found: warn
          retention-days: 30

  pay-n01-corrected:
    if: github.ref == 'refs/heads/lab/fin01-pg17-recovery-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55847:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
      - name: Verify exact lab ref and preserved base trees
        env:
          FIN01_MAIN_SHA: 1a0d758d09310f2914c475c37d358c4cf885cc01
          FIN01_CANDIDATE_COMMIT: d2af51d0636b0e83fad924f08c6e688b2e2bfb5e
          FIN01_WORKFLOW_COMMIT: 2aab313c4948110402d6fea77c399605427ea12b
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/lab/fin01-pg17-recovery-20261029"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${FIN01_MAIN_SHA}^{tree}")" = "6e5e6f1c77a55cec4cafee016cbe277aab89bf30"
          test "$(git rev-parse "${FIN01_CANDIDATE_COMMIT}^")" = "${FIN01_MAIN_SHA}"
          test "$(git rev-parse "${FIN01_CANDIDATE_COMMIT}^{tree}")" = "a04237a9e7e0a07b52a3c2247b8affff94f30a32"
          test "$(git rev-parse "${FIN01_WORKFLOW_COMMIT}^")" = "${FIN01_CANDIDATE_COMMIT}"
          test "$(git rev-parse "${FIN01_WORKFLOW_COMMIT}^{tree}")" = "19a3525723449fb5764f075c3d18ab92ff34c165"
          git merge-base --is-ancestor "${FIN01_WORKFLOW_COMMIT}" HEAD
          test "$(sha256sum scripts/fin01/fin01-pay-n01-candidate.sql | cut -d ' ' -f 1)" = "de269931a034e9df25ff50ed321f6ab6a0cc23e93fe37f0255c64ed3e780b804"
      - name: Prepare disposable synthetic PostgreSQL fixture
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          mkdir -p artifacts/fin01/logs
          bash scripts/fin01/prepare-postgres-lab.sh fin01_cert_corrected 2>&1 | tee artifacts/fin01/logs/setup.log
      - name: Apply the FIN-01 SQL candidate in the isolated database
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          docker exec -i "${PG_CONTAINER_ID}" psql -X -v ON_ERROR_STOP=1 -U postgres -d fin01_cert_corrected < scripts/fin01/fin01-pay-n01-candidate.sql 2>&1 | tee artifacts/fin01/logs/candidate-sql.log
      - name: Run corrected PAY-N01 and replay assertions
        run: |
          set -o pipefail
          node scripts/fin01/run-postgres-tests.mjs --only=PAY-N01 --database=fin01_cert_corrected --report=pay-n01-corrected 2>&1 | tee artifacts/fin01/logs/pay-n01-corrected.log
      - name: Capture PostgreSQL service log
        if: always()
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts/fin01/logs
          docker logs "${PG_CONTAINER_ID}" > artifacts/fin01/logs/postgres.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fin01-pg17-pay-n01-corrected
          path: |
            artifacts/fin01/**
            docs/reports/fin01-r22/pay-n01-corrected.json
            docs/reports/fin01-r22/fixture-boundaries.json
          if-no-files-found: warn
          retention-days: 30

  fin01-suite-pay-n01-pay-n02:
