name: Customer Messaging Phase 4 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/customerMessaging/**'
      - 'src/services/sales/postSaleEffects.js'
      - 'src/services/sales/__tests__/postSaleEffects.outbox.test.js'
      - 'src/services/sales/__tests__/receiptImagePreparation.test.js'
      - 'src/services/sales/__tests__/receiptWhatsApp.ecommerce.test.js'
      - 'src/services/__test__/sales/processSaleCore.test.js'
      - 'src/services/db/__tests__/customerCreditRepository.test.js'
      - 'src/hooks/pos/usePosCheckout.js'
      - 'src/hooks/pos/useLayawayFlow.js'
      - 'src/hooks/pos/__tests__/usePosCheckout.ecommerce.test.jsx'
      - 'src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx'
      - 'src/pages/CustomersPage.jsx'
      - '.github/workflows/customer-messaging-phase4-validation.yml'

permissions:
  contents: read

jobs:
  focused-validation:
    name: Customer messaging / finance boundary / lint / builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate exact refs
        shell: bash
        run: |
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"

      - name: PR-local whitespace gate
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Customer messaging focused tests
        run: >-
          npx vitest run
          src/services/customerMessaging/__tests__
          src/services/sales/__tests__/postSaleEffects.outbox.test.js
          src/services/sales/__tests__/receiptImagePreparation.test.js
          src/services/sales/__tests__/receiptWhatsApp.ecommerce.test.js
          src/services/__test__/sales/processSaleCore.test.js
          src/services/db/__tests__/customerCreditRepository.test.js
          src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx
          src/hooks/pos/__tests__/usePosCheckout.ecommerce.test.jsx
          --maxWorkers=4

      - name: ESLint modified Phase 4 files
        run: >-
          npx eslint
          src/services/customerMessaging/outbox.js
          src/services/customerMessaging/outboxUi.js
          src/services/customerMessaging/index.js
          src/services/customerMessaging/adapters.js
          src/services/customerMessaging/__tests__/outbox.test.js
          src/services/sales/postSaleEffects.js
          src/services/sales/__tests__/postSaleEffects.outbox.test.js
          src/hooks/pos/usePosCheckout.js
          src/hooks/pos/useLayawayFlow.js
          src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx
          src/pages/CustomersPage.jsx

      - name: npm run build
        run: npm run build

      - name: npm run build:store
        run: npm run build:store
