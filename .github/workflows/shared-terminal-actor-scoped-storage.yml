name: Shared Terminal Actor Scoped Storage Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/services/auth/actorScopedStorage.js'
      - 'src/services/auth/actorOperationalHandoff.js'
      - 'src/services/auth/actorSessionRuntimeBridge.js'
      - 'src/services/supabase.js'
      - 'src/services/tenant/tenantScopedStorage.js'
      - 'src/store/slices/license/**'
      - 'src/services/sync/syncOutboxService.js'
      - 'src/services/salesCloud/salesCloudShadowService.js'
      - 'src/services/salesService.js'
      - 'src/services/__tests__/salesService.ecommerce.test.js'
      - 'src/hooks/pos/useLayawayFlow.js'
      - 'src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx'
      - 'src/hooks/pos/__tests__/useActiveOrders.tenantPersistence.test.js'
      - 'src/components/layout/Layout.jsx'
      - 'src/services/auth/__tests__/actorScopedStorage.test.js'
      - 'src/services/auth/__tests__/actorOperationalHandoff.test.js'
      - 'src/services/auth/__tests__/actorOperationalAuthority.test.js'
      - 'src/services/auth/__tests__/actorSessionRuntimeBridge.test.js'
      - 'src/services/sync/__tests__/syncOutboxService.actorOrigin.test.js'
      - 'src/services/tenant/__tests__/tenantScopedStorage.test.js'
      - 'docs/reports/SHARED.TERMINAL.3.ACTOR.SCOPED.STORAGE.HANDOFF.md'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
      - '.github/workflows/shared-terminal-actor-scoped-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARED_TERMINAL_3_HISTORICAL_BASE_SHA: 06f42bcbbc4282c6f8f5d4e0b9065437d16f19ab
  SHARED_TERMINAL_3_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
  SHARED_TERMINAL_3_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '06f42bcbbc4282c6f8f5d4e0b9065437d16f19ab' }}
  SHARED_TERMINAL_3_BASE_ARTIFACT: shared-terminal-3-base-full-suite-${{ github.run_id }}
  SHARED_TERMINAL_3_CANDIDATE_ARTIFACT: shared-terminal-3-candidate-full-suite-${{ github.run_id }}
  SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT: shared-terminal-3-full-suite-differential-${{ github.run_id }}

jobs:
  resolve-pr-base:
    name: Resolve current PR base commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout current base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Capture immutable base SHA
        id: resolve
        shell: bash
        run: |
          base_sha="$(git rev-parse HEAD)"
          echo "PR_BASE_SHA=${base_sha}"
          echo "sha=${base_sha}" >> "$GITHUB_OUTPUT"
  focused-validation:
    name: Actor storage / handoff / tenant / sync / POS / lint / builds
    needs:
      - resolve-pr-base
    env:
      SHARED_TERMINAL_3_PR_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
      SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate comparison refs
        shell: bash
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_3_PR_BASE_SHA}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          echo "COMPARISON_BASE_SHA=${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          echo "HISTORICAL_BASE_SHA=${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_PR_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          test -n "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}"
          test "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}" = "${SHARED_TERMINAL_3_PR_BASE_SHA}"
          git cat-file -e "${SHARED_TERMINAL_3_PR_BASE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_CANDIDATE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}^{commit}"

      - name: PR-local blocking whitespace hygiene
        shell: bash
        run: git diff --check "${SHARED_TERMINAL_3_PR_BASE_SHA}...${SHARED_TERMINAL_3_CANDIDATE_SHA}"

      - name: Historical contract-base whitespace observation
        if: always()
        shell: bash
        run: |
          set +e
          git diff --check "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}...${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          historical_status=$?
          set -e

          if [[ "${historical_status}" -eq 0 ]]; then
            echo "Historical contract-base whitespace check: no findings."
          else
            echo "::warning title=Historical contract-base whitespace::Existing findings are observational only and do not block validation."
          fi

          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Actor storage, authority and handoff focused tests
        run: >-
          npx vitest run
          src/services/auth/__tests__/actorRuntimeController.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/services/auth/__tests__/actorScopedStorage.test.js
          src/services/auth/__tests__/actorOperationalHandoff.test.js
          src/services/auth/__tests__/actorOperationalAuthority.test.js
          --maxWorkers=4

      - name: Real sale and layaway caller contracts under granted actor fixture
        run: >-
          npx vitest run
          src/services/__tests__/salesService.ecommerce.test.js
          src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx
          --maxWorkers=2

      - name: Actor and tenant persistence lifecycle tests
        run: >-
          npx vitest run
          src/services/tenant/__tests__/tenantScopedStorage.test.js
          src/hooks/pos/__tests__/useActiveOrders.tenantPersistence.test.js
          --maxWorkers=1

      - name: Actor-origin outbox focused tests
        run: npx vitest run src/services/sync/__tests__/syncOutboxService.actorOrigin.test.js --maxWorkers=4

      - name: POS cart / drafts / checkout / restaurant regression observation
        if: always()
        continue-on-error: true
        run: npx vitest run src/hooks/pos/__tests__ --maxWorkers=4

      - name: Sync / outbox regression observation
        if: always()
        continue-on-error: true
        run: npx vitest run src/services/sync/__tests__ --maxWorkers=4

      - name: Tenant isolation and recovery regression observation
        if: always()
        continue-on-error: true
        run: npx vitest run src/services/tenant/__tests__ src/services/db/__tests__ --maxWorkers=4

      - name: Authentication and shared-device regression observation
        if: always()
        continue-on-error: true
        run: >-
          npx vitest run
          src/store/slices/license
          src/services/__tests__/deviceModePolicy.test.js
          src/store/slices/license/__tests__/sharedDeviceModeRouting.test.js
          --maxWorkers=4

      - name: Cash regression observation
        if: always()
        continue-on-error: true
        run: npx vitest run src/services/cash --maxWorkers=4

      - name: Relevant ESLint
        if: always()
        run: >-
          npx eslint
          src/services/auth/actorScopedStorage.js
          src/services/auth/actorOperationalHandoff.js
          src/services/auth/actorSessionRuntimeBridge.js
          src/services/tenant/tenantScopedStorage.js
          src/services/sync/syncOutboxService.js
          src/services/salesCloud/salesCloudShadowService.js
          src/services/salesService.js
          src/services/__tests__/salesService.ecommerce.test.js
          src/hooks/pos/useLayawayFlow.js
          src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx
          src/components/layout/Layout.jsx
          src/services/auth/__tests__/actorScopedStorage.test.js
          src/services/auth/__tests__/actorOperationalHandoff.test.js
          src/services/auth/__tests__/actorOperationalAuthority.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/services/sync/__tests__/syncOutboxService.actorOrigin.test.js
          src/services/tenant/__tests__/tenantScopedStorage.test.js
          src/hooks/pos/__tests__/useActiveOrders.tenantPersistence.test.js

      - name: npm run build
        if: always()
        run: npm run build

      - name: npm run build:store
        if: always()
        run: npm run build:store

      - name: npm run build:store:vercel
        if: always()
        run: npm run build:store:vercel

  full-suite-baseline:
    name: Full suite BASE repeated (observational)
    needs:
      - resolve-pr-base
    env:
      SHARED_TERMINAL_3_PR_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
      SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR comparison BASE SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_COMPARISON_BASE_SHA }}
          fetch-depth: 0
          path: subject

      - name: Validate BASE checkout
        shell: bash
        working-directory: subject
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_3_PR_BASE_SHA}"
          echo "COMPARISON_BASE_SHA=${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          test "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}" = "${SHARED_TERMINAL_3_PR_BASE_SHA}"

      - name: Checkout exact candidate evidence tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          path: evidence-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Install dependencies
        working-directory: subject
        run: npm ci

      - name: Build BASE validation artifacts
        working-directory: subject
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: BASE PublicStore and Ecommerce focused regression evidence (50 repetitions per target)
        run: >-
          node evidence-tools/scripts/ci/focused-target-evidence.mjs
          --targets evidence-tools/scripts/ci/shared-terminal-public-store-targets.json
          --subject-dir subject
          --output-dir .
          --repetitions 50
          --max-workers 4

      - name: BASE raw full-suite repetitions
        shell: bash
        working-directory: subject
        env:
          LANZO_ADMIN_PWA_BUILD_REQUIRED: '1'
          LANZO_STORE_PWA_BUILD_REQUIRED: '1'
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="../full-suite-${i}.json" 2>&1 | tee "../full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "../full-suite-${i}.exit"
            echo "BASE repetition ${i} raw exit code: ${code}"
          done

      - name: BASE Vitest discovery isolation negative control
        shell: bash
        working-directory: subject
        run: |
          npx vitest list --filesOnly > ../vitest-discovered-files-base.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const testFile = 'src/components/ai/__tests__/CommercialAIAgents.test.jsx';
          const discovered = fs.readFileSync('../vitest-discovered-files-base.txt', 'utf8')
            .split(/\r?\n/)
            .map((value) => value.trim().replaceAll('\\', '/'))
            .filter(Boolean);
          const targetMatches = discovered.filter((value) => value.endsWith(testFile));
          const duplicateExists = fs.existsSync(`../evidence-tools/${testFile}`);
          if (!duplicateExists) throw new Error('NEG-01 fixture is missing from evidence-tools');
          if (targetMatches.length !== 1) {
            throw new Error(`NEG-01 expected one subject discovery, found ${targetMatches.length}`);
          }
          if (discovered.some((value) => value.includes('evidence-tools'))) {
            throw new Error('NEG-01 discovered a test from evidence-tools');
          }
          if (new Set(discovered).size !== discovered.length) {
            throw new Error('Vitest returned duplicate file paths inside subject');
          }
          console.log(`NEG-01 PASS: ${discovered.length} subject test files; one CommercialAIAgents file; evidence-tools twin excluded.`);
          NODE

      - name: BASE CommercialAIAgents duplicate-submit test (50 independent runs)
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test_name='blocks same-turn duplicate submits so one UI action creates one analysis and one history entry'
          summary="../commercial-ai-base-repetitions.txt"
          : > "$summary"
          for iteration in $(seq 1 50); do
            report="../commercial-ai-base-${iteration}.json"
            log="../commercial-ai-base-${iteration}.log"
            if npx vitest run src/components/ai/__tests__/CommercialAIAgents.test.jsx --testNamePattern="$test_name" --maxWorkers=1 --reporter=json --outputFile="$report" >"$log" 2>&1; then
              if ! node --input-type=module - "$report" <<'NODE'
          import fs from 'node:fs';

          const expected = 'blocks same-turn duplicate submits so one UI action creates one analysis and one history entry';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const assertions = (report.testResults || []).flatMap((file) => file.assertionResults || []);
          const matches = assertions.filter((assertion) => assertion.title === expected);
          const passed = assertions.filter((assertion) => assertion.status === 'passed').length;
          if (report.numFailedTests !== 0 || report.numPassedTests !== 1
            || passed !== 1 || matches.length !== 1 || matches[0].status !== 'passed') {
            throw new Error(`Focused test did not pass exactly once: ${JSON.stringify({
              failed: report.numFailedTests,
              passed: report.numPassedTests,
              matched: matches.map((assertion) => assertion.status)
            })}`);
          }
          NODE
              then
                cat "$log"
                exit 1
              fi
              printf 'PASS %s\n' "$iteration" >> "$summary"
              rm -f "$report" "$log"
            else
              code=$?
              printf 'FAIL %s\n' "$iteration" >> "$summary"
              cat "$log"
              exit "$code"
            fi
          done
          test "$(wc -l < "$summary" | tr -d ' ')" = 50

      - name: Record BASE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "BASE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('BASE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload BASE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_BASE_ARTIFACT }}
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
            public-store-*.json
            public-store-*.log
            public-store-*.exit
            focused-target-summary.json
            vitest-discovered-files-base.txt
            commercial-ai-base-repetitions.txt
            commercial-ai-base-*.json
            commercial-ai-base-*.log
          if-no-files-found: error
          overwrite: true

  full-suite-candidate:
    name: Full suite CANDIDATE repeated (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          fetch-depth: 0
          path: subject

      - name: Validate CANDIDATE checkout
        shell: bash
        working-directory: subject
        run: |
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${SHARED_TERMINAL_3_CANDIDATE_SHA}"

      - name: Checkout exact candidate evidence tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          path: evidence-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Install dependencies
        working-directory: subject
        run: npm ci

      - name: Build CANDIDATE validation artifacts
        working-directory: subject
        run: |
          npm run build
          npm run build:store
          npm run build:store:vercel

      - name: CANDIDATE PublicStore and Ecommerce focused regression evidence (50 repetitions per target)
        run: >-
          node evidence-tools/scripts/ci/focused-target-evidence.mjs
          --targets evidence-tools/scripts/ci/shared-terminal-public-store-targets.json
          --subject-dir subject
          --output-dir .
          --repetitions 50
          --max-workers 4

      - name: CANDIDATE raw full-suite repetitions
        shell: bash
        working-directory: subject
        env:
          LANZO_ADMIN_PWA_BUILD_REQUIRED: '1'
          LANZO_STORE_PWA_BUILD_REQUIRED: '1'
        run: |
          set -o pipefail
          for i in 1 2; do
            set +e
            npm run test:ci -- --reporter=json --outputFile="../full-suite-${i}.json" 2>&1 | tee "../full-suite-${i}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "../full-suite-${i}.exit"
            echo "CANDIDATE repetition ${i} raw exit code: ${code}"
          done

      - name: CANDIDATE Vitest discovery isolation negative control
        shell: bash
        working-directory: subject
        run: |
          npx vitest list --filesOnly > ../vitest-discovered-files-candidate.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const testFile = 'src/components/ai/__tests__/CommercialAIAgents.test.jsx';
          const discovered = fs.readFileSync('../vitest-discovered-files-candidate.txt', 'utf8')
            .split(/\r?\n/)
            .map((value) => value.trim().replaceAll('\\', '/'))
            .filter(Boolean);
          const targetMatches = discovered.filter((value) => value.endsWith(testFile));
          const duplicateExists = fs.existsSync(`../evidence-tools/${testFile}`);
          if (!duplicateExists) throw new Error('NEG-01 fixture is missing from evidence-tools');
          if (targetMatches.length !== 1) {
            throw new Error(`NEG-01 expected one subject discovery, found ${targetMatches.length}`);
          }
          if (discovered.some((value) => value.includes('evidence-tools'))) {
            throw new Error('NEG-01 discovered a test from evidence-tools');
          }
          if (new Set(discovered).size !== discovered.length) {
            throw new Error('Vitest returned duplicate file paths inside subject');
          }
          console.log(`NEG-01 PASS: ${discovered.length} subject test files; one CommercialAIAgents file; evidence-tools twin excluded.`);
          NODE

      - name: CANDIDATE CommercialAIAgents duplicate-submit test (50 independent runs)
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          test_name='blocks same-turn duplicate submits so one UI action creates one analysis and one history entry'
          summary="../commercial-ai-candidate-repetitions.txt"
          : > "$summary"
          for iteration in $(seq 1 50); do
            report="../commercial-ai-candidate-${iteration}.json"
            log="../commercial-ai-candidate-${iteration}.log"
            if npx vitest run src/components/ai/__tests__/CommercialAIAgents.test.jsx --testNamePattern="$test_name" --maxWorkers=1 --reporter=json --outputFile="$report" >"$log" 2>&1; then
              if ! node --input-type=module - "$report" <<'NODE'
          import fs from 'node:fs';

          const expected = 'blocks same-turn duplicate submits so one UI action creates one analysis and one history entry';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const assertions = (report.testResults || []).flatMap((file) => file.assertionResults || []);
          const matches = assertions.filter((assertion) => assertion.title === expected);
          const passed = assertions.filter((assertion) => assertion.status === 'passed').length;
          if (report.numFailedTests !== 0 || report.numPassedTests !== 1
            || passed !== 1 || matches.length !== 1 || matches[0].status !== 'passed') {
            throw new Error(`Focused test did not pass exactly once: ${JSON.stringify({
              failed: report.numFailedTests,
              passed: report.numPassedTests,
              matched: matches.map((assertion) => assertion.status)
            })}`);
          }
          NODE
              then
                cat "$log"
                exit 1
              fi
              printf 'PASS %s\n' "$iteration" >> "$summary"
              rm -f "$report" "$log"
            else
              code=$?
              printf 'FAIL %s\n' "$iteration" >> "$summary"
              cat "$log"
              exit "$code"
            fi
          done
          test "$(wc -l < "$summary" | tr -d ' ')" = 50

      - name: NEG-02/03 duplicate analysis and history mutation controls
        shell: bash
        working-directory: subject
        run: |
          set -euo pipefail
          page="src/components/ai/CommercialAIAgentsPage.jsx"
          test_file="src/components/ai/__tests__/CommercialAIAgents.test.jsx"
          page_backup="$(mktemp)"
          test_backup="$(mktemp)"
          summary="../negative-control-ai-summary.txt"
          log_double_analysis="../negative-control-ai-double-analysis.log"
          log_double_history="../negative-control-ai-double-history.log"
          test_name='blocks same-turn duplicate submits so one UI action creates one analysis and one history entry'
          cp "$page" "$page_backup"
          cp "$test_file" "$test_backup"
          restore_mutations() {
            cp "$page_backup" "$page"
            cp "$test_backup" "$test_file"
            rm -f "$page_backup" "$test_backup"
          }
          trap restore_mutations EXIT
          : > "$summary"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'src/components/ai/CommercialAIAgentsPage.jsx';
          const source = fs.readFileSync(file, 'utf8');
          const guard = 'if (isAnalyzing || analysisInFlightRef.current) return;';
          if (source.split(guard).length !== 2) throw new Error('NEG-02 guard not found exactly once');
          fs.writeFileSync(file, source.replace(guard, 'if (false) return;'));

          const testFile = 'src/components/ai/__tests__/CommercialAIAgents.test.jsx';
          const testSource = fs.readFileSync(testFile, 'utf8');
          const testTitle = 'blocks same-turn duplicate submits so one UI action creates one analysis and one history entry';
          const titleIndex = testSource.indexOf(testTitle);
          if (titleIndex < 0 || testSource.indexOf(testTitle, titleIndex + testTitle.length) >= 0) {
            throw new Error('NEG-02 duplicate-submit test not found exactly once');
          }
          const testStart = testSource.lastIndexOf('it(', titleIndex);
          const testEnd = testSource.indexOf('\n  });', titleIndex);
          if (testStart < 0 || testEnd < 0) throw new Error('NEG-02 test boundaries not found');
          const testBody = testSource.slice(testStart, testEnd);
          const assertion = 'await waitFor(() => expect(runtime.runAgent).toHaveBeenCalledTimes(1));';
          if (testBody.split(assertion).length !== 2) {
            throw new Error('NEG-02 runAgent assertion not found exactly once in target test');
          }
          const boundedAssertion = 'await waitFor(() => expect(runtime.runAgent).toHaveBeenCalledTimes(1), { timeout: 1000 });';
          fs.writeFileSync(testFile, testSource.slice(0, testStart)
            + testBody.replace(assertion, boundedAssertion)
            + testSource.slice(testEnd));
          NODE

          set +e
          npx vitest run "$test_file" --testNamePattern="$test_name" --maxWorkers=1 --reporter=verbose >"$log_double_analysis" 2>&1
          analysis_code=$?
          set -e
          if [[ "$analysis_code" -eq 0 ]]; then
            echo "NEG-02 FAIL: duplicate runAgent calls were not detected."
            cat "$log_double_analysis"
            exit 1
          fi
          if ! grep -F "$test_name" "$log_double_analysis" >/dev/null; then
            echo "NEG-02 FAIL: target test title missing from the mutation result."
            cat "$log_double_analysis"
            exit 1
          fi
          if ! grep -Eiq 'to be called 1 times, but got 2 times|to be called 1 time, but got 2 times' "$log_double_analysis"; then
            echo "NEG-02 FAIL: test failed for a reason other than detecting two runAgent calls."
            cat "$log_double_analysis"
            exit 1
          fi
          printf 'NEG-02 PASS: disabling the in-flight guard caused the same-turn test to detect two runAgent calls.\n' >> "$summary"
          cp "$page_backup" "$page"
          cp "$test_backup" "$test_file"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'src/components/ai/__tests__/CommercialAIAgents.test.jsx';
          const source = fs.readFileSync(file, 'utf8');
          const original = 'setTenantStorageItem: (key, value) => runtime.historyStorage.set(key, value),';
          const duplicateWrite = `setTenantStorageItem: (key, value) => {
            const envelope = JSON.parse(value);
            if (Array.isArray(envelope.entries) && envelope.entries.length === 1) {
              envelope.entries.push({ ...envelope.entries[0], id: '9999999999999-999999' });
            }
            runtime.historyStorage.set(key, JSON.stringify(envelope));
          },`;
          if (source.split(original).length !== 2) throw new Error('NEG-03 storage fixture not found exactly once');
          fs.writeFileSync(file, source.replace(original, duplicateWrite));
          NODE

          set +e
          npx vitest run "$test_file" --testNamePattern="$test_name" --maxWorkers=1 --reporter=verbose >"$log_double_history" 2>&1
          history_code=$?
          set -e
          if [[ "$history_code" -eq 0 ]]; then
            echo "NEG-03 FAIL: duplicate persisted history was not detected."
            cat "$log_double_history"
            exit 1
          fi
          if ! grep -F "$test_name" "$log_double_history" >/dev/null; then
            echo "NEG-03 FAIL: target test title missing from the mutation result."
            cat "$log_double_history"
            exit 1
          fi
          if ! grep -Eiq 'to have a length of 1 but got 2|length of 1 but got 2' "$log_double_history"; then
            echo "NEG-03 FAIL: test failed for a reason other than detecting two persisted history entries."
            cat "$log_double_history"
            exit 1
          fi
          printf 'NEG-03 PASS: a fixture write that persisted two history entries failed the same-turn history assertion.\n' >> "$summary"

          restore_mutations
          trap - EXIT
          git diff --exit-code -- "$page" "$test_file"
          cat "$summary"

      - name: Record CANDIDATE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "CANDIDATE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('CANDIDATE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload CANDIDATE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_CANDIDATE_ARTIFACT }}
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
            public-store-*.json
            public-store-*.log
            public-store-*.exit
            focused-target-summary.json
            vitest-discovered-files-candidate.txt
            commercial-ai-candidate-repetitions.txt
            commercial-ai-candidate-*.json
            commercial-ai-candidate-*.log
            negative-control-ai-summary.txt
            negative-control-ai-double-analysis.log
            negative-control-ai-double-history.log
          if-no-files-found: error
          overwrite: true

  differential-regression-gate:
    name: Differential repeated full-suite regression gate
    if: always()
    needs:
      - resolve-pr-base
      - full-suite-baseline
      - full-suite-candidate
    env:
      SHARED_TERMINAL_3_PR_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
      SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ needs.resolve-pr-base.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate differential refs
        shell: bash
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_3_PR_BASE_SHA}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          echo "COMPARISON_BASE_SHA=${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          echo "BASE_ARTIFACT=${SHARED_TERMINAL_3_BASE_ARTIFACT}"
          echo "CANDIDATE_ARTIFACT=${SHARED_TERMINAL_3_CANDIDATE_ARTIFACT}"
          echo "DIFFERENTIAL_ARTIFACT=${SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT}"
          test "$(git rev-parse HEAD)" = "${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          test "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}" = "${SHARED_TERMINAL_3_PR_BASE_SHA}"

      - name: Download BASE evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_BASE_ARTIFACT }}
          path: differential/base

      - name: Download CANDIDATE evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_CANDIDATE_ARTIFACT }}
          path: differential/candidate

      - name: Compare repeated BASE vs CANDIDATE failure envelope
        run: |
          node scripts/compare-shared-terminal-full-suite.mjs \
            differential/base \
            differential/candidate \
            differential/full-suite-differential.md \
            differential/full-suite-differential.json
          cat differential/full-suite-differential.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT }}
          path: |
            differential/full-suite-differential.md
            differential/full-suite-differential.json
          if-no-files-found: error
          overwrite: true
