name: Shared Terminal Actor Scoped Storage Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/auth/actorScopedStorage.js'
      - 'src/services/auth/actorOperationalHandoff.js'
      - 'src/services/auth/actorSessionRuntimeBridge.js'
      - 'src/services/supabase.js'
      - 'src/services/tenant/tenantScopedStorage.js'
      - 'src/store/slices/license/**'
      - 'src/services/sync/syncOutboxService.js'
      - 'src/services/salesCloud/salesCloudShadowService.js'
      - 'src/services/salesService.js'
      - 'src/services/__tests__/salesService.ecommerce.test.js'
      - 'src/hooks/pos/useLayawayFlow.js'
      - 'src/hooks/pos/__tests__/useLayawayFlow.ecommerce.test.jsx'
      - 'src/hooks/pos/__tests__/useActiveOrders.tenantPersistence.test.js'
      - 'src/components/layout/Layout.jsx'
      - 'src/services/auth/__tests__/actorScopedStorage.test.js'
      - 'src/services/auth/__tests__/actorOperationalHandoff.test.js'
      - 'src/services/auth/__tests__/actorOperationalAuthority.test.js'
      - 'src/services/auth/__tests__/actorSessionRuntimeBridge.test.js'
      - 'src/services/sync/__tests__/syncOutboxService.actorOrigin.test.js'
      - 'src/services/tenant/__tests__/tenantScopedStorage.test.js'
      - 'docs/reports/SHARED.TERMINAL.3.ACTOR.SCOPED.STORAGE.HANDOFF.md'
      - 'docs/reports/SHARED.TERMINAL.4.CASH.STATION.FINANCIAL.HANDOFF.md'
      - '.github/workflows/shared-terminal-actor-scoped-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARED_TERMINAL_3_HISTORICAL_BASE_SHA: 06f42bcbbc4282c6f8f5d4e0b9065437d16f19ab
  SHARED_TERMINAL_3_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
  SHARED_TERMINAL_3_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '06f42bcbbc4282c6f8f5d4e0b9065437d16f19ab' }}
  SHARED_TERMINAL_3_BASE_ARTIFACT: shared-terminal-3-base-full-suite-${{ github.run_id }}
  SHARED_TERMINAL_3_CANDIDATE_ARTIFACT: shared-terminal-3-candidate-full-suite-${{ github.run_id }}
  SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT: shared-terminal-3-full-suite-differential-${{ github.run_id }}

jobs:
  resolve-pr-base:
    name: Resolve current PR base commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout current base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Capture immutable base SHA
        id: resolve
        shell: bash
        run: |
          base_sha="$(git rev-parse HEAD)"
          echo "PR_BASE_SHA=${base_sha}"
          echo "sha=${base_sha}" >> "$GITHUB_OUTPUT"
  focused-validation:
    name: Actor storage / handoff / tenant / sync / POS / lint / builds
    needs:
      - resolve-pr-base
    env:
      SHARED_TERMINAL_3_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && needs.resolve-pr-base.outputs.sha || github.sha }}
      SHARED_TERMINAL_3_COMPARISON_BASE_SHA: ${{ github.event_name == 'pull_request' && needs.resolve-pr-base.outputs.sha || '06f42bcbbc4282c6f8f5d4e0b9065437d16f19ab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate comparison refs
        shell: bash
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_3_PR_BASE_SHA}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          echo "COMPARISON_BASE_SHA=${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          echo "HISTORICAL_BASE_SHA=${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_PR_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          test -n "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          test -n "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}" = "${SHARED_TERMINAL_3_PR_BASE_SHA}"
          fi
          git cat-file -e "${SHARED_TERMINAL_3_PR_BASE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_CANDIDATE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}^{commit}"
          git cat-file -e "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}^{commit}"

      - name: PR-local blocking whitespace hygiene
        shell: bash
        run: git diff --check "${SHARED_TERMINAL_3_PR_BASE_SHA}...${SHARED_TERMINAL_3_CANDIDATE_SHA}"

      - name: Historical contract-base whitespace observation
        if: always()
        shell: bash
        run: |
          set +e
          git diff --check "${SHARED_TERMINAL_3_HISTORICAL_BASE_SHA}...${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          historical_status=$?
          set -e

          if [[ "${historical_status}" -eq 0 ]]; then
            echo "Historical contract-base whitespace check: no findings."
          else
            echo "::warning title=Historical contract-base whitespace::Existing findings are observational only and do not block validation."
          fi

          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Actor storage, authority and handoff focused tests
        run: >-
          npx vitest run
          src/services/auth/__tests__/actorRuntimeController.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/services/auth/__tests__/actorScopedStorage.test.js
          src/services/auth…5139 tokens truncated…G-02 PASS: disabling the in-flight guard caused the same-turn test to detect two runAgent calls.\n' >> "$summary"
          cp "$page_backup" "$page"
          cp "$test_backup" "$test_file"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'src/components/ai/__tests__/CommercialAIAgents.test.jsx';
          const source = fs.readFileSync(file, 'utf8');
          const original = 'setTenantStorageItem: (key, value) => runtime.historyStorage.set(key, value),';
          const duplicateWrite = `setTenantStorageItem: (key, value) => {
            const envelope = JSON.parse(value);
            if (Array.isArray(envelope.entries) && envelope.entries.length === 1) {
              envelope.entries.push({ ...envelope.entries[0], id: '9999999999999-999999' });
            }
            runtime.historyStorage.set(key, JSON.stringify(envelope));
          },`;
          if (source.split(original).length !== 2) throw new Error('NEG-03 storage fixture not found exactly once');
          fs.writeFileSync(file, source.replace(original, duplicateWrite));
          NODE

          set +e
          npx vitest run "$test_file" --testNamePattern="$test_name" --maxWorkers=1 --reporter=verbose >"$log_double_history" 2>&1
          history_code=$?
          set -e
          if [[ "$history_code" -eq 0 ]]; then
            echo "NEG-03 FAIL: duplicate persisted history was not detected."
            cat "$log_double_history"
            exit 1
          fi
          if ! grep -F "$test_name" "$log_double_history" >/dev/null; then
            echo "NEG-03 FAIL: target test title missing from the mutation result."
            cat "$log_double_history"
            exit 1
          fi
          if ! grep -Eiq 'to have a length of 1 but got 2|length of 1 but got 2' "$log_double_history"; then
            echo "NEG-03 FAIL: test failed for a reason other than detecting two persisted history entries."
            cat "$log_double_history"
            exit 1
          fi
          printf 'NEG-03 PASS: a fixture write that persisted two history entries failed the same-turn history assertion.\n' >> "$summary"

          restore_mutations
          trap - EXIT
          git diff --exit-code -- "$page" "$test_file"
          cat "$summary"

      - name: Record CANDIDATE raw results
        if: always()
        run: |
          for i in 1 2; do
            echo "CANDIDATE repetition ${i} raw exit code: $(cat full-suite-${i}.exit 2>/dev/null || echo missing)"
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('full-suite-${i}.json','utf8'));console.log('CANDIDATE repetition ${i}:',r.numPassedTests,'passed /',r.numFailedTests,'failed /',r.numPendingTests ?? r.numTodoTests ?? 0,'skipped /',r.numTotalTests,'total')"
          done

      - name: Upload CANDIDATE full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_CANDIDATE_ARTIFACT }}
          path: |
            full-suite-*.json
            full-suite-*.log
            full-suite-*.exit
            public-store-*.json
            public-store-*.log
            public-store-*.exit
            focused-target-summary.json
            vitest-discovered-files-candidate.txt
            commercial-ai-candidate-repetitions.txt
            commercial-ai-candidate-*.json
            commercial-ai-candidate-*.log
            negative-control-ai-summary.txt
            negative-control-ai-double-analysis.log
            negative-control-ai-double-history.log
          if-no-files-found: error
          overwrite: true

  differential-regression-gate:
    name: Differential repeated full-suite regression gate
    if: always()
    needs:
      - full-suite-baseline
      - full-suite-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_TERMINAL_3_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Validate differential refs
        shell: bash
        run: |
          echo "PR_BASE_SHA=${SHARED_TERMINAL_3_PR_BASE_SHA}"
          echo "CANDIDATE_SHA=${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          echo "COMPARISON_BASE_SHA=${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}"
          echo "BASE_ARTIFACT=${SHARED_TERMINAL_3_BASE_ARTIFACT}"
          echo "CANDIDATE_ARTIFACT=${SHARED_TERMINAL_3_CANDIDATE_ARTIFACT}"
          echo "DIFFERENTIAL_ARTIFACT=${SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT}"
          test "$(git rev-parse HEAD)" = "${SHARED_TERMINAL_3_CANDIDATE_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test "${SHARED_TERMINAL_3_COMPARISON_BASE_SHA}" = "${SHARED_TERMINAL_3_PR_BASE_SHA}"
          fi

      - name: Download BASE evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_BASE_ARTIFACT }}
          path: differential/base

      - name: Download CANDIDATE evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_CANDIDATE_ARTIFACT }}
          path: differential/candidate

      - name: Compare repeated BASE vs CANDIDATE failure envelope
        run: |
          node scripts/compare-shared-terminal-full-suite.mjs \
            differential/base \
            differential/candidate \
            differential/full-suite-differential.md \
            differential/full-suite-differential.json
          cat differential/full-suite-differential.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHARED_TERMINAL_3_DIFFERENTIAL_ARTIFACT }}
          path: |
            differential/full-suite-differential.md
            differential/full-suite-differential.json
          if-no-files-found: error
          overwrite: true
