name: PR127 Apply Residual Snapshot

on:
  push:
    branches:
      - hotfix/dexie-primary-key-recovery-admin-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hotfix/dexie-primary-key-recovery-admin-bootstrap
          fetch-depth: 0
      - name: Apply audited residual payload once
        run: |
          if [ ! -d .github/pr127-residual ]; then
            echo "Residual payload already removed; nothing to apply."
            exit 0
          fi
          cat .github/pr127-residual/part* | base64 --decode > /tmp/pr127-residual.tar.gz
          tar -xzf /tmp/pr127-residual.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/hotfix-dexie-validation.yml \
            .github/workflows/pr127-global-comparison.yml \
            src/components/common/DatabaseRecoveryGate.jsx \
            src/components/common/__tests__/DatabaseRecoveryGate.test.jsx \
            src/services/db/__tests__/indexedDbPrimaryKeyRecovery.test.js \
            src/services/db/databaseRuntime.js \
            src/services/db/indexedDbPreflight.js \
            src/store/__tests__/useProductStore.structuralRecovery.test.js \
            src/store/slices/license/__tests__/licenseAdminActions.localRecovery.test.js \
            src/store/useProductStore.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Payload already applied."
            exit 0
          fi
          git commit -m "fix(hotfix): resolve residual recovery blockers"
          git push origin HEAD:hotfix/dexie-primary-key-recovery-admin-bootstrap
