name: PR285 Final Correction

on:
  push:
    branches:
      - fix/ecommerce-pro-general-settings-r1

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-pro-general-settings-r1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply deterministic correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          general_path = root / 'src/components/ecommerce/EcommercePortalGeneralSettings.jsx'
          general_path.write_text("""import { Link2, PackageCheck, Truck } from 'lucide-react';
          import './EcommercePortalGeneralSettings.css';

          const featureValue = (features, camelKey, snakeKey) => (
            features?.[camelKey] ?? features?.[snakeKey]
          );

          export const resolveEcommerceGeneralSettingsCapabilities = (features = {}) => {
            const customSlugFeature = featureValue(features, 'customSlug', 'ecommerce_custom_slug');
            const configuredDeliveryMode = featureValue(
              features,
              'deliveryPickupSettings',
              'ecommerce_delivery_pickup_settings'
            );

            return {
              customSlugAllowed: customSlugFeature === true,
              deliveryPickupSettings: configuredDeliveryMode || 'basic'
            };
          };

          export default function EcommercePortalGeneralSettings({
            form,
            onFieldChange,
            plan,
            features
          }) {
            const {
              customSlugAllowed,
              deliveryPickupSettings
            } = resolveEcommerceGeneralSettingsCapabilities(features);
            const deliveryModeLabel = deliveryPickupSettings === 'advanced' ? 'Avanzada' : 'Básica';
            const authoritativePlanCode = String(plan?.code || '').trim() || 'unknown';

            return (
              <fieldset
                className=\"ecom-general-settings\"
                data-testid=\"ecommerce-general-settings\"
                data-plan-code={authoritativePlanCode}
              >
                <div className=\"ecom-general-settings__heading\">
                  <div>
                    <span className=\"ecom-admin-eyebrow\">Configuración de tienda</span>
                    <h3>Contenido y operación general</h3>
                    <p>
                      Estos datos forman parte de la tienda en cualquier plan. Lanzo Nube agrega capacidades
                      avanzadas sin sustituir esta configuración.
                    </p>
                  </div>
                </div>

                <div className=\"ecom-admin-form-grid\">
                  <label className=\"form-group ecom-admin-span-2\">
                    <span className=\"form-label\">Enlace / slug</span>
                    <div className=\"ecom-admin-input-icon\">
                      <Link2 size={16} aria-hidden=\"true\" />
                      <input
                        className=\"form-input\"
                        aria-label=\"Slug de la tienda\"
                        value={form.slug}
                        onChange={onFieldChange('slug')}
                        minLength={3}
                        maxLength={64}
                        pattern=\"[a-z0-9](?:[a-z0-9-]{1,62}[a-z0-9])?\"
                        readOnly={!customSlugAllowed}
                        disabled={!customSlugAllowed}
                      />
                    </div>
                    <small className=\"ecom-admin-help\">
                      {customSlugAllowed
                        ? 'Lanzo Nube permite personalizar el enlace. Usa 3–64 caracteres en minúsculas, números o guiones.'
                        : 'Tu enlace actual se conserva. Personalizarlo requiere Lanzo Nube.'}
                    </small>
                  </label>

                  <label className=\"form-group\">
                    <span className=\"form-label\">Frase corta / headline</span>
                    <input
                      className=\"form-input\"
                      aria-label=\"Frase corta\"
                      value={form.headline}
                      onChange={onFieldChange('headline')}
                      maxLength={160}
                      placeholder=\"Ej. Pide fácil y recibe rápido\"
                    />
                  </label>

                  <label className=\"form-group\">
                    <span className=\"form-label\">Pedido mínimo</span>
                    <input
                      className=\"form-input\"
                      aria-label=\"Pedido mínimo\"
                      type=\"number\"
                      min=\"0\"
                      step=\"0.01\"
                      value={form.minOrderTotal}
                      onChange={onFieldChange('minOrderTotal')}
                    />
                  </label>

                  <label className=\"form-group ecom-admin-span-2\">
                    <span className=\"form-label\">Descripción</span>
                    <textarea
                      className=\"form-input\"
                      aria-label=\"Descripción\"
                      value={form.description}
                      onChange={onFieldChange('description')}
                      maxLength={1000}
                      rows={4}
                      placeholder=\"Cuenta brevemente qué ofrece tu negocio.\"
                    />
                  </label>

                  <div className=\"form-group ecom-admin-span-2\">
                    <div className=\"ecom-general-settings__delivery-heading\">
                      <span className=\"form-label\">Métodos de entrega</span>
                      <span className=\"ecom-general-settings__capability\">
                        Configuración {deliveryModeLabel.toLowerCase()}
                      </span>
                    </div>
                    <small className=\"ecom-admin-help\">
                      Debe permanecer habilitado al menos un método. El nivel {deliveryModeLabel.toLowerCase()}
                      define capacidades adicionales, no la visibilidad de estos controles.
                    </small>
                    <div className=\"ecom-general-settings__delivery-options\">
                      <label className=\"ecom-general-settings__delivery-option\">
                        <input
                          type=\"checkbox\"
                          aria-label=\"Recoger\"
                          checked={Boolean(form.pickupEnabled)}
                          onChange={onFieldChange('pickupEnabled')}
                        />
                        <PackageCheck size={18} aria-hidden=\"true\" />
                        <span>Recoger</span>
                      </label>
                      <label className=\"ecom-general-settings__delivery-option\">
                        <input
                          type=\"checkbox\"
                          aria-label=\"Domicilio\"
                          checked={Boolean(form.deliveryEnabled)}
                          onChange={onFieldChange('deliveryEnabled')}
                        />
                        <Truck size={18} aria-hidden=\"true\" />
                        <span>Domicilio</span>
                      </label>
                    </div>
                  </div>
                </div>
              </fieldset>
            );
          }
          """.replace('          ', ''), encoding='utf-8')

          info_path = root / 'src/components/ecommerce/EcommerceBusinessInformationPanel.jsx'
          info = info_path.read_text(encoding='utf-8')
          info = replace_once(
              info,
              "  portal,\n  form,\n  onFieldChange,",
              "  portal,\n  form,\n  plan,\n  features,\n  onFieldChange,",
              'information props'
          )
          info = replace_once(
              info,
              "        <EcommercePortalGeneralSettings form={form} onFieldChange={onFieldChange} />",
              "        <EcommercePortalGeneralSettings\n          form={form}\n          onFieldChange={onFieldChange}\n          plan={plan}\n          features={features}\n        />",
              'general settings props'
          )
          info_path.write_text(info, encoding='utf-8')

          settings_path = root / 'src/components/ecommerce/EcommercePortalSettings.jsx'
          settings = settings_path.read_text(encoding='utf-8')
          settings = replace_once(settings, "  Image as ImageIcon,\n", "", 'ImageIcon import')
          settings = replace_once(settings, "  Link2,\n", "", 'Link2 import')
          settings = replace_once(
              settings,
              "    customSlug: false,\n    maxPublishedProducts: 10,\n    cloudCatalogSource: false\n  });",
              "    customSlug: false,\n    deliveryPickupSettings: 'basic',\n    maxPublishedProducts: 10,\n    cloudCatalogSource: false\n  });",
              'initial feature defaults'
          )
          settings = replace_once(
              settings,
              "      customSlug: false,\n      maxPublishedProducts: 10,\n      cloudCatalogSource: false\n    });",
              "      customSlug: false,\n      deliveryPickupSettings: 'basic',\n      maxPublishedProducts: 10,\n      cloudCatalogSource: false\n    });",
              'loaded feature defaults'
          )
          settings = replace_once(
              settings,
              "          portal={portal}\n          form={form}\n          onFieldChange={updateForm}",
              "          portal={portal}\n          form={form}\n          plan={plan}\n          features={features}\n          onFieldChange={updateForm}",
              'information authoritative props'
          )

          legacy_pattern = re.compile(
              r"      \{portal && showBasicPortalEditor && activeSection === 'design' && \(\n"
              r"        <form className=\"ui-card ecom-admin-form-card\" onSubmit=\{submitPortal\}>.*?"
              r"      \)\}\n\n"
              r"      \{portal && activeSection === 'catalog' && <section",
              re.S
          )
          design_only = """      {portal && showBasicPortalEditor && activeSection === 'design' && (
        <form className=\"ui-card ecom-admin-form-card\" onSubmit={submitPortal}>
          <div className=\"ecom-admin-card-heading\">
            <div>
              <span className=\"ecom-admin-eyebrow\">Diseño básico</span>
              <h3>Identidad visual de tu tienda</h3>
              <p>Personaliza únicamente la apariencia visual de tu tienda.</p>
            </div>
            <Save size={22} />
          </div>
          <EcommercePortalCustomizationPanel
            isPro={isPro}
            portal={portal}
            initialLogoUrl={portal ? null : publicUrl(companyProfile?.logo)}
            licenseKey={licenseKey}
            disabled={savingPortal}
            onChange={handleCustomizationChange}
            onBusyChange={setCustomizationBusy}
          />
          <div className=\"ecom-admin-form-actions\">
            <span><CheckCircle2 size={16} /> Los datos quedan separados del flujo POS.</span>
            <button type=\"submit\" className=\"btn btn-primary\" disabled={savingPortal || customizationBusy || customization.valid === false}>
              {savingPortal
                ? <LoaderCircle className=\"ecom-admin-spin\" size={17} />
                : <Save size={17} />}
              {' '}Guardar diseño
            </button>
          </div>
        </form>
      )}

      {portal && activeSection === 'catalog' && <section"""
          settings, count = legacy_pattern.subn(design_only, settings, count=1)
          if count != 1:
              raise SystemExit(f'legacy Free design block: expected 1 match, found {count}')
          settings_path.write_text(settings, encoding='utf-8')

          css_path = root / 'src/components/ecommerce/EcommercePortalGeneralSettings.css'
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(
              r"\n/\*\n \* The legacy Free design form.*?"
              r"#ecom-portal-panel-design \+ form\.ecom-admin-form-card > \.ecom-admin-card-heading p \{\n  display: none;\n\}\n",
              "\n",
              css,
              count=1,
              flags=re.S
          )
          if '#ecom-portal-panel-design + form.ecom-admin-form-card' in css:
              raise SystemExit('legacy CSS hiding selectors remain')
          css_path.write_text(css, encoding='utf-8')

          general_test_path = root / 'src/components/ecommerce/__tests__/EcommercePortalGeneralSettings.test.jsx'
          general_test_path.write_text("""// @vitest-environment jsdom
          import { act, cleanup, render, screen } from '@testing-library/react';
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { useAppStore } from '../../../store/useAppStore';
          import EcommercePortalGeneralSettings, {
            resolveEcommerceGeneralSettingsCapabilities
          } from '../EcommercePortalGeneralSettings';

          const baseForm = Object.freeze({
            slug: 'mi-tienda-personalizada',
            headline: 'Entrega rápida',
            description: 'Descripción persistente',
            minOrderTotal: '150',
            pickupEnabled: true,
            deliveryEnabled: false
          });

          const handlers = new Map();
          const onFieldChange = (field) => {
            if (!handlers.has(field)) handlers.set(field, vi.fn());
            return handlers.get(field);
          };

          const FREE_PLAN = Object.freeze({ code: 'free_trial', name: 'Plan Free' });
          const PRO_PLAN = Object.freeze({ code: 'pro_monthly', name: 'Lanzo Nube' });
          const FREE_FEATURES = Object.freeze({
            customSlug: false,
            deliveryPickupSettings: 'basic'
          });
          const PRO_FEATURES = Object.freeze({
            customSlug: true,
            deliveryPickupSettings: 'advanced'
          });

          const renderSettings = ({ plan = FREE_PLAN, features = FREE_FEATURES } = {}) => render(
            <EcommercePortalGeneralSettings
              form={baseForm}
              onFieldChange={onFieldChange}
              plan={plan}
              features={features}
            />
          );

          const expectGeneralControlsVisible = () => {
            expect(screen.getByLabelText('Slug de la tienda')).toBeInTheDocument();
            expect(screen.getByLabelText('Frase corta')).toBeInTheDocument();
            expect(screen.getByLabelText('Descripción')).toBeInTheDocument();
            expect(screen.getByLabelText('Pedido mínimo')).toBeInTheDocument();
            expect(screen.getByLabelText('Recoger')).toBeInTheDocument();
            expect(screen.getByLabelText('Domicilio')).toBeInTheDocument();
          };

          describe('EcommercePortalGeneralSettings authoritative plan parity', () => {
            afterEach(() => {
              cleanup();
              handlers.clear();
              act(() => useAppStore.setState({ licenseDetails: null }));
            });

            it('derives capabilities only from administrative portal features', () => {
              expect(resolveEcommerceGeneralSettingsCapabilities({
                customSlug: false,
                deliveryPickupSettings: 'basic'
              })).toEqual({
                customSlugAllowed: false,
                deliveryPickupSettings: 'basic'
              });

              expect(resolveEcommerceGeneralSettingsCapabilities({
                customSlug: true,
                deliveryPickupSettings: 'advanced'
              })).toEqual({
                customSlugAllowed: true,
                deliveryPickupSettings: 'advanced'
              });
            });

            it('does not let a Pro plan code override explicit customSlug=false', () => {
              renderSettings({
                plan: PRO_PLAN,
                features: { customSlug: false, deliveryPickupSettings: 'advanced' }
              });
              expect(screen.getByLabelText('Slug de la tienda')).toBeDisabled();
              expect(screen.getByText('Configuración avanzada')).toBeInTheDocument();
            });

            it('keeps every general control visible in FREE while locking the slug', () => {
              renderSettings();
              expectGeneralControlsVisible();
              expect(screen.getByLabelText('Slug de la tienda')).toBeDisabled();
              expect(screen.getByLabelText('Slug de la tienda')).toHaveValue('mi-tienda-personalizada');
              expect(screen.getByText('Configuración básica')).toBeInTheDocument();
            });

            it('keeps every general control visible in PRO and unlocks the slug', () => {
              renderSettings({ plan: PRO_PLAN, features: PRO_FEATURES });
              expectGeneralControlsVisible();
              expect(screen.getByLabelText('Slug de la tienda')).not.toBeDisabled();
              expect(screen.getByLabelText('Slug de la tienda')).toHaveValue('mi-tienda-personalizada');
              expect(screen.getByText('Configuración avanzada')).toBeInTheDocument();
            });

            it('ignores stale FREE licenseDetails when RPC plan/features are PRO', () => {
              act(() => useAppStore.setState({
                licenseDetails: {
                  license_key: 'license-fixture',
                  plan_code: 'free_trial',
                  features: { ecommerce_custom_slug: false }
                }
              }));
              renderSettings({ plan: PRO_PLAN, features: PRO_FEATURES });
              expect(screen.getByLabelText('Slug de la tienda')).not.toBeDisabled();
            });

            it('ignores stale PRO licenseDetails when RPC plan/features are FREE', () => {
              act(() => useAppStore.setState({
                licenseDetails: {
                  license_key: 'license-fixture',
                  plan_code: 'pro_monthly',
                  features: { ecommerce_custom_slug: true }
                }
              }));
              renderSettings({ plan: FREE_PLAN, features: FREE_FEATURES });
              expect(screen.getByLabelText('Slug de la tienda')).toBeDisabled();
            });

            it('preserves values and toggles only authoritative capabilities across FREE → PRO → FREE → PRO', () => {
              const view = renderSettings();
              const assertState = (editable) => {
                expectGeneralControlsVisible();
                expect(screen.getByLabelText('Slug de la tienda')).toHaveValue('mi-tienda-personalizada');
                expect(screen.getByLabelText('Frase corta')).toHaveValue('Entrega rápida');
                expect(screen.getByLabelText('Descripción')).toHaveValue('Descripción persistente');
                expect(screen.getByLabelText('Pedido mínimo')).toHaveValue(150);
                expect(screen.getByLabelText('Recoger')).toBeChecked();
                expect(screen.getByLabelText('Domicilio')).not.toBeChecked();
                if (editable) expect(screen.getByLabelText('Slug de la tienda')).not.toBeDisabled();
                else expect(screen.getByLabelText('Slug de la tienda')).toBeDisabled();
              };

              assertState(false);
              view.rerender(
                <EcommercePortalGeneralSettings form={baseForm} onFieldChange={onFieldChange} plan={PRO_PLAN} features={PRO_FEATURES} />
              );
              assertState(true);
              view.rerender(
                <EcommercePortalGeneralSettings form={baseForm} onFieldChange={onFieldChange} plan={FREE_PLAN} features={FREE_FEATURES} />
              );
              assertState(false);
              view.rerender(
                <EcommercePortalGeneralSettings form={baseForm} onFieldChange={onFieldChange} plan={PRO_PLAN} features={PRO_FEATURES} />
              );
              assertState(true);
            });

            it('keeps an existing custom slug visible but read-only after downgrade', () => {
              renderSettings();
              const slug = screen.getByLabelText('Slug de la tienda');
              expect(slug).toHaveValue('mi-tienda-personalizada');
              expect(slug).toBeDisabled();
            });
          });
          """.replace('          ', ''), encoding='utf-8')

          settings_test_path = root / 'src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx'
          tests = settings_test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              "  features: { customSlug: false, maxPublishedProducts: 10 }",
              "  features: { customSlug: false, deliveryPickupSettings: 'basic', maxPublishedProducts: 10 }",
              'default test features'
          )
          tests = replace_once(
              tests,
              "    customSlug: true,\n    cloudCatalogSource: true,",
              "    customSlug: true,\n    deliveryPickupSettings: 'advanced',\n    cloudCatalogSource: true,",
              'pro test features'
          )
          tests = replace_once(
              tests,
              "      customSlug: false,\n      cloudCatalogSource: false,",
              "      customSlug: false,\n      deliveryPickupSettings: 'basic',\n      cloudCatalogSource: false,",
              'free test features'
          )

          insertion = r'''

          it('uses RPC PRO features when licenseDetails is stale FREE', async () => {
            act(() => setStoreState({
              role: 'admin',
              settings: true,
              licenseDetails: {
                license_key: 'license-fixture',
                plan_code: 'free_trial',
                features: { ecommerce_custom_slug: false }
              }
            }));
            renderExistingProPortal();
            await waitFor(() => expect(getEcommercePortal).toHaveBeenCalledTimes(1));
            expect(screen.getByLabelText('Slug de la tienda')).not.toBeDisabled();
            expect(screen.getByTestId('ecommerce-general-settings')).toHaveAttribute('data-plan-code', 'pro_monthly');
          });

          it('uses RPC FREE features when licenseDetails is stale PRO', async () => {
            act(() => setStoreState({
              role: 'admin',
              settings: true,
              licenseDetails: {
                license_key: 'license-fixture',
                plan_code: 'pro_monthly',
                features: { ecommerce_custom_slug: true }
              }
            }));
            renderExistingFreePortal();
            await waitFor(() => expect(getEcommercePortal).toHaveBeenCalledTimes(1));
            expect(screen.getByLabelText('Slug de la tienda')).toBeDisabled();
            expect(screen.getByTestId('ecommerce-general-settings')).toHaveAttribute('data-plan-code', 'free_trial');
          });

          it('renders each general control exactly once for PRO and none inside Design', async () => {
            renderExistingProPortal();
            await waitFor(() => expect(getEcommercePortal).toHaveBeenCalledTimes(1));
            ['Slug de la tienda', 'Frase corta', 'Descripción', 'Pedido mínimo', 'Recoger', 'Domicilio']
              .forEach((label) => expect(screen.getAllByLabelText(label)).toHaveLength(1));

            fireEvent.click(screen.getByRole('tab', { name: 'Diseño' }));
            expect(screen.queryByText('Frase corta / headline')).toBeNull();
            expect(screen.queryByText('Pedido mínimo')).toBeNull();
            expect(screen.queryByText('Métodos de entrega')).toBeNull();
            expect(screen.queryByLabelText('Slug de la tienda')).toBeNull();
          });

          it('renders each general control exactly once for FREE and removes legacy controls from Design', async () => {
            renderExistingFreePortal();
            await waitFor(() => expect(getEcommercePortal).toHaveBeenCalledTimes(1));
            ['Slug de la tienda', 'Frase corta', 'Descripción', 'Pedido mínimo', 'Recoger', 'Domicilio']
              .forEach((label) => expect(screen.getAllByLabelText(label)).toHaveLength(1));

            fireEvent.click(screen.getByRole('tab', { name: 'Diseño' }));
            expect(screen.getByText('Identidad visual de tu tienda')).toBeInTheDocument();
            expect(screen.queryByText('Enlace / slug *')).toBeNull();
            expect(screen.queryByText('Frase corta / headline')).toBeNull();
            expect(screen.queryByText('Descripcion')).toBeNull();
            expect(screen.queryByText('Pedido minimo')).toBeNull();
            expect(screen.queryByText('Metodos de entrega')).toBeNull();
            expect(screen.queryByLabelText('Slug de la tienda')).toBeNull();
          });

          it('saves the complete shared commercial settings payload from PRO Information', async () => {
            renderExistingProPortal();
            await waitFor(() => expect(getEcommercePortal).toHaveBeenCalledTimes(1));

            fireEvent.change(screen.getByLabelText('Frase corta'), {
              target: { value: 'Headline actualizado' }
            });
            fireEvent.change(screen.getByLabelText('Descripción'), {
              target: { value: 'Descripción actualizada desde Información' }
            });
            fireEvent.change(screen.getByLabelText('Pedido mínimo'), {
              target: { value: '275.50' }
            });
            fireEvent.click(screen.getByLabelText('Recoger'));
            fireEvent.click(screen.getByLabelText('Domicilio'));
            fireEvent.change(screen.getByLabelText('Slug de la tienda'), {
              target: { value: 'negocio-pro-actualizado' }
            });
            fireEvent.click(screen.getByRole('button', { name: 'Guardar información' }));

            await waitFor(() => expect(saveEcommercePortal).toHaveBeenCalledTimes(1));
            expect(saveEcommercePortal.mock.calls[0][0]).toMatchObject({
              headline: 'Headline actualizado',
              description: 'Descripción actualizada desde Información',
              minOrderTotal: 275.5,
              pickupEnabled: false,
              deliveryEnabled: true,
              slug: 'negocio-pro-actualizado'
            });
          });
          '''
          last_close = tests.rfind('\n});\n')
          if last_close == -1:
              raise SystemExit('could not locate final describe close')
          tests = tests[:last_close] + insertion + tests[last_close:]
          settings_test_path.write_text(tests, encoding='utf-8')

          # Structural guards required by PR #285 correction.
          general = general_path.read_text(encoding='utf-8')
          settings = settings_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          if 'useAppStore' in general or 'licenseDetails' in general:
              raise SystemExit('GeneralSettings still reads store/licenseDetails')
          if "customSlugFeature === true ||" in general:
              raise SystemExit('plan fallback still overrides customSlug')
          for forbidden in [
              '#ecom-portal-panel-design + form.ecom-admin-form-card > .ecom-admin-form-grid',
              '#ecom-portal-panel-design + form.ecom-admin-form-card > .ecom-admin-card-heading p'
          ]:
              if forbidden in css:
                  raise SystemExit(f'forbidden CSS selector remains: {forbidden}')
          design_start = settings.index("{portal && showBasicPortalEditor && activeSection === 'design'")
          catalog_start = settings.index("{portal && activeSection === 'catalog'", design_start)
          free_design = settings[design_start:catalog_start]
          for forbidden in ["updateForm('slug')", "updateForm('headline')", "updateForm('description')", "updateForm('minOrderTotal')", "updateForm('pickupEnabled')", "updateForm('deliveryEnabled')"]:
              if forbidden in free_design:
                  raise SystemExit(f'legacy Free design control remains: {forbidden}')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused ESLint
        run: >-
          npx eslint
          src/components/ecommerce/EcommercePortalSettings.jsx
          src/components/ecommerce/EcommerceBusinessInformationPanel.jsx
          src/components/ecommerce/EcommercePortalGeneralSettings.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalGeneralSettings.test.jsx

      - name: Diff check against main
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main --

      - name: Focused tests
        run: >-
          npx vitest run
          src/components/ecommerce/__tests__/EcommercePortalGeneralSettings.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          --maxWorkers=4

      - name: Build
        run: npm run build

      - name: Commit validated correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr285-final-correction.yml
          git add -A
