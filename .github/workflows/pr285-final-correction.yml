name: PR285 Final Correction

on:
  push:
    branches:
      - "fix/ecommerce-pro-general-settings-r1"

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: "fix/ecommerce-pro-general-settings-r1"
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply deterministic correction
        run: |
          python scripts/ci/pr285-final-correction.py
          python scripts/ci/pr285-fix-test-expectation.py

      - name: Install dependencies
        run: npm ci

      - name: Focused ESLint
        run: >-
          npx eslint
          src/components/ecommerce/EcommercePortalSettings.jsx
          src/components/ecommerce/EcommerceBusinessInformationPanel.jsx
          src/components/ecommerce/EcommercePortalGeneralSettings.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalGeneralSettings.test.jsx

      - name: Diff check against main
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main --

      - name: Focused tests
        run: >-
          npx vitest run
          src/components/ecommerce/__tests__/EcommercePortalGeneralSettings.test.jsx
          src/components/ecommerce/__tests__/EcommercePortalSettings.test.jsx
          --maxWorkers=4

      - name: Build
        run: npm run build

      - name: Commit validated correction and remove temporary files
        run: |
          rm .github/workflows/pr285-final-correction.yml
          rm scripts/ci/pr285-final-correction.py
          rm scripts/ci/pr285-fix-test-expectation.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ecommerce): use authoritative portal capabilities"
          git push origin HEAD:fix/ecommerce-pro-general-settings-r1
