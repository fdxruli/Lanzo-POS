name: Canonical Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_package:
        description: canonical preserves the normal guard; restaurant_backend_v1 uses the reviewed private historical overlay.
        type: choice
        options: [canonical, restaurant_backend_v1]
        default: canonical
        required: true
      mode:
        description: DRY_RUN never applies migrations. APPLY requires exact confirmation.
        type: choice
        options: [DRY_RUN, APPLY]
        default: DRY_RUN
        required: true
      expected_git_sha:
        description: Exact current main SHA.
        type: string
        required: true
      expected_versions:
        description: Exact comma-separated pending versions. Backend package requires archive then bridge; NONE is canonical DRY_RUN only.
        type: string
        required: true
      apply_confirmation:
        description: APPLY <expected_versions>
        type: string
        default: ''
        required: false

permissions:
  contents: read
concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  canonical-migration-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_PROJECT_REF: odlrhijtfyavryeqivaa
      SUPABASE_CLI_VERSION: 2.79.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Verify dispatch and immutable target
        shell: bash
        env:
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
          EXPECTED_VERSIONS: ${{ inputs.expected_versions }}
          APPLY_MODE: ${{ inputs.mode }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${EXPECTED_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_GIT_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_GIT_SHA}"
          test "${SUPABASE_PROJECT_REF}" = odlrhijtfyavryeqivaa
          test "$(supabase --version)" = "${SUPABASE_CLI_VERSION}"
          if [ "${APPLY_MODE}" = APPLY ]; then
            test "${EXPECTED_VERSIONS}" != NONE
            test "${APPLY_CONFIRMATION}" = "APPLY ${EXPECTED_VERSIONS}"
          fi
      - name: Prepare canonical or private verified release directory
        shell: bash
        env:
          RELEASE_PACKAGE: ${{ inputs.release_package }}
          EXPECTED_VERSIONS: ${{ inputs.expected_versions }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          case "${RELEASE_PACKAGE}" in
            canonical)
              release_root="${GITHUB_WORKSPACE}"
              ;;
            restaurant_backend_v1)
              release_root="$(mktemp -d "${RUNNER_TEMP}/pr352-backend.XXXXXX")"
              ;;
            *) exit 1 ;;
          esac
          echo "RELEASE_ROOT=${release_root}" >> "${GITHUB_ENV}"
          if [ "${RELEASE_PACKAGE}" = restaurant_backend_v1 ]; then
            mkdir -p "${release_root}/supabase/migrations"
            cp supabase/config.toml "${release_root}/supabase/config.toml"
          fi
          cd "${release_root}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"
          if [ "${RELEASE_PACKAGE}" = restaurant_backend_v1 ]; then
            # Fetch is read-only. Raw historical SQL stays private and is never uploaded.
            supabase migration fetch --linked > "${release_root}/fetch.private.log" 2>&1
            node "${GITHUB_WORKSPACE}/scripts/supabase/pr352-prepare-production-ledger-overlay.mjs" prepare \
              "${GITHUB_WORKSPACE}/docs/fixtures/restaurant-backend-release.json" \
              "${release_root}/supabase/migrations" "${GITHUB_WORKSPACE}/supabase/migrations" \
              "${release_root}/snapshot.private.json" "${EXPECTED_VERSIONS}"
          fi
      - name: Validate exact pending set and dry-run
        shell: bash
        env:
          EXPECTED_VERSIONS: ${{ inputs.expected_versions }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${RELEASE_ROOT}"
          test "$(cat supabase/.temp/project-ref)" = "${SUPABASE_PROJECT_REF}"
          supabase migration list --linked > "${RUNNER_TEMP}/migration-list.before.txt"
          node "${GITHUB_WORKSPACE}/scripts/supabase/verify-canonical-migration-ledger.mjs" \
            "${RELEASE_ROOT}/supabase/migrations" "${EXPECTED_VERSIONS}" "${RUNNER_TEMP}/migration-list.before.txt"
          supabase db push --dry-run --linked | tee "${RUNNER_TEMP}/db-push-dry-run.txt"
          if [ "${EXPECTED_VERSIONS}" = NONE ] && ! grep -Eqi 'no.*migration|nothing to apply|up to date' "${RUNNER_TEMP}/db-push-dry-run.txt"; then
            echo "DRY_RUN NONE did not prove zero migrations to apply" >&2
            exit 1
          fi
      - name: Apply exactly the reviewed set
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          RELEASE_PACKAGE: ${{ inputs.release_package }}
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
          EXPECTED_VERSIONS: ${{ inputs.expected_versions }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_GIT_SHA}"
          if [ "${RELEASE_PACKAGE}" = restaurant_backend_v1 ]; then
            node scripts/supabase/pr352-prepare-production-ledger-overlay.mjs verify \
              docs/fixtures/restaurant-backend-release.json "${RELEASE_ROOT}/supabase/migrations" \
              "${GITHUB_WORKSPACE}/supabase/migrations" "${RELEASE_ROOT}/snapshot.private.json"
          fi
          cd "${RELEASE_ROOT}"
          test "$(cat supabase/.temp/project-ref)" = "${SUPABASE_PROJECT_REF}"
          supabase migration list --linked > "${RUNNER_TEMP}/migration-list.apply.txt"
          node "${GITHUB_WORKSPACE}/scripts/supabase/verify-canonical-migration-ledger.mjs" \
            "${RELEASE_ROOT}/supabase/migrations" "${EXPECTED_VERSIONS}" "${RUNNER_TEMP}/migration-list.apply.txt"
          supabase db push --dry-run --linked
          supabase migration list --linked > "${RUNNER_TEMP}/migration-list.apply-confirm.txt"
          node "${GITHUB_WORKSPACE}/scripts/supabase/verify-canonical-migration-ledger.mjs" \
            "${RELEASE_ROOT}/supabase/migrations" "${EXPECTED_VERSIONS}" "${RUNNER_TEMP}/migration-list.apply-confirm.txt"
          supabase db push --linked --yes
      - name: Verify final canonical ledger
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          EXPECTED_VERSIONS: ${{ inputs.expected_versions }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${RELEASE_ROOT}"
          supabase migration list --linked > "${RUNNER_TEMP}/migration-list.after.txt"
          node "${GITHUB_WORKSPACE}/scripts/supabase/verify-canonical-migration-ledger.mjs" \
            "${RELEASE_ROOT}/supabase/migrations" "${EXPECTED_VERSIONS}" "${RUNNER_TEMP}/migration-list.after.txt" after-apply
      - name: Remove private historical SQL and connection metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_ROOT:-}" == "${RUNNER_TEMP}/pr352-backend."* ]]; then
            test ! -L "${RELEASE_ROOT}"
            rm -rf -- "${RELEASE_ROOT}"
          fi
