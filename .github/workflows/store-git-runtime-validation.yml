name: Store Git Runtime Validation

on:
  push:
    branches:
      - agent/fix-store-git-esm-runtime
    paths:
      - 'store/**'
      - 'scripts/build-store-vercel.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/store-git-runtime-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'store/**'
      - 'scripts/build-store-vercel.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/store-git-runtime-validation.yml'

permissions:
  contents: read

jobs:
  module-contract:
    name: module-contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate store module scope and handlers
        run: >-
          npx vitest run
          store/tests/social-preview/storeGitModuleScope.test.js
          store/tests/social-preview/storePageEndpoint.test.js
          store/tests/social-preview/storeOgEndpoint.test.js

      - name: Build Git-delivered store artifact
        run: npm run build:store:vercel

      - name: Diff check
        run: git diff --check

  social-preview-suite:
    name: social-preview-suite (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete social preview suite
        run: npx vitest run store/tests/social-preview

  validation-result:
    name: validation-result
    if: always()
    needs:
      - module-contract
      - social-preview-suite
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        env:
          MODULE_RESULT: ${{ needs.module-contract.result }}
          SOCIAL_RESULT: ${{ needs.social-preview-suite.result }}
        run: |
          echo "module-contract=${MODULE_RESULT}"
          echo "social-preview-suite=${SOCIAL_RESULT}"
          test "${MODULE_RESULT}" = success
          test "${SOCIAL_RESULT}" = success
