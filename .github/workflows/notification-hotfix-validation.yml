name: Notification Hotfix Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/notifications/**'
      - 'src/store/slices/createNotificationActorStateSlice.js'
      - 'src/store/slices/__tests__/createNotificationActorStateSlice.test.js'
      - 'src/store/useAppStore.js'
      - 'src/components/notifications/**'
      - 'supabase/migrations/**notification**'
      - 'supabase/tests/notification_*'
      - '.github/notification-hotfix-*.sql'
      - '.github/workflows/notification-hotfix-validation.yml'

permissions:
  contents: read

env:
  HOTFIX_PARENT_SHA: c079d9d1ddd404b9b139f04158df91bbc439a781

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused notification tests
        run: >-
          npm run test:ci --
          src/services/notifications/__tests__/cloudNotificationService.test.js
          src/services/notifications/__tests__/notificationRealtimeService.ecommerce.test.js
          src/components/notifications/__tests__/NotificationBell.test.jsx
          src/store/slices/__tests__/createNotificationActorStateSlice.test.js
          src/store/slices/__tests__/createNotificationSlice.tenantIsolation.test.js
          --reporter=verbose
      - name: Shared-terminal actor/session tests
        run: >-
          npx vitest run
          src/services/auth/__tests__/actorRuntimeController.test.js
          src/services/auth/__tests__/actorSessionRuntimeBridge.test.js
          src/store/slices/license/licenseAdminActions.test.js
          src/store/slices/license/licenseSessionTransitions.test.js
          --maxWorkers=4
      - name: Notification lint
        run: >-
          npx eslint
          src/services/notifications/cloudNotificationService.js
          src/services/notifications/notificationRealtimeService.js
          src/store/slices/createNotificationActorStateSlice.js
          src/store/slices/__tests__/createNotificationActorStateSlice.test.js
          src/store/useAppStore.js
          src/components/notifications/NotificationCenterDrawer.jsx
          src/components/notifications/NotificationBell.jsx
          src/components/notifications/NotificationItem.jsx
          src/services/notifications/__tests__/cloudNotificationService.test.js
          src/services/notifications/__tests__/notificationRealtimeService.ecommerce.test.js
          src/components/notifications/__tests__/NotificationBell.test.jsx
      - name: Production build
        run: npm run build
      - name: Exact-parent diff check
        run: |
          git cat-file -e "${HOTFIX_PARENT_SHA}^{commit}"
          git diff --check "${HOTFIX_PARENT_SHA}...HEAD"

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_hotfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notification_hotfix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/notification_hotfix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | \
            awk 'BEGIN { ok=1 } !/^[0-9]{14}_[A-Za-z0-9][A-Za-z0-9_-]*\.sql$/ { print "invalid migration filename: " $0 > "/dev/stderr"; ok=0 } END { exit ok ? 0 : 1 }'
      - name: Build deployed-equivalent pre-hotfix fixture
        run: psql "${DB_URL}" -v ON_ERROR_STOP=1 -f .github/notification-hotfix-preprod-fixture.sql
      - name: Apply five notification migrations in order
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            supabase/migrations/20260823084100_notification_center_seen_state.sql
            supabase/migrations/20260823084200_notification_center_seen_rpc.sql
            supabase/migrations/20260823084300_notification_operational_incidents.sql
            supabase/migrations/20260823084350_notification_operational_incident_fk_hardening.sql
            supabase/migrations/20260823084400_notification_operational_generators.sql
          )
          for migration in "${migrations[@]}"; do
            echo "APPLY ${migration}"
            psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run committed notification SQL regressions
        run: |
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/tests/notification_center_seen_incidents_test.sql
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f supabase/tests/notification_admin_actor_fail_closed_test.sql
      - name: Run executable actor/tenant validation
        run: psql "${DB_URL}" -v ON_ERROR_STOP=1 -f .github/notification-hotfix-functional-validation.sql
      - name: Concurrent open-incident validation
        shell: bash
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "delete from private.pos_notification_operational_incidents where license_id='10000000-0000-0000-0000-000000000001' and incident_type='device_disabled' and entity_id='concurrency-test';"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "select private.set_pos_operational_incident_state('10000000-0000-0000-0000-000000000001','device_disabled','concurrency-test',true,'{}');" > /tmp/inc1.out &
          p1=$!
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "select private.set_pos_operational_incident_state('10000000-0000-0000-0000-000000000001','device_disabled','concurrency-test',true,'{}');" > /tmp/inc2.out &
          p2=$!
          wait "$p1"
          wait "$p2"
          cat /tmp/inc1.out /tmp/inc2.out
          test "$(psql "${DB_URL}" -Atqc "select count(*) from private.pos_notification_operational_incidents where license_id='10000000-0000-0000-0000-000000000001' and incident_type='device_disabled' and entity_id='concurrency-test' and resolved_at is null")" = "1"
      - name: Post-migration structural summary
        shell: bash
        run: |
          set -euo pipefail
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "select column_name,data_type,is_nullable from information_schema.columns where table_schema='public' and table_name='pos_notification_reads' and column_name in ('seen_at','read_at','archived_at') order by column_name;"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "select conname,pg_get_constraintdef(oid) from pg_constraint where conrelid='private.pos_notification_operational_incidents'::regclass order by conname;"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -c "select n.nspname,p.proname,p.prosecdef,p.proconfig from pg_proc p join pg_namespace n on n.oid=p.pronamespace where (n.nspname,p.proname) in (('public','list_pos_notifications'),('public','mark_pos_notifications_seen'),('private','set_pos_operational_incident_state'),('private','generate_staff_operational_notifications'),('private','generate_sync_operational_notifications')) order by 1,2;"
